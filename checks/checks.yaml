schemaVersion: 2
checks:
  - id: model
    kind: contract
    level: L0
    description: Parse and validate domains, claims, checks, workstreams, profiles, workloads, and case-local manifests.
    domains: [platform]
    runner: project-model
    automatic: true
  - id: registry
    kind: contract
    level: L1
    description: Generate and validate the runner registry from case-local manifests.
    domains: [platform, virtual-assets, visibility, frame-runtime]
    runner: generated-registry
    automatic: true
  - id: changed-coverage
    kind: guard
    level: L0
    description: Require existing changed files to match a declared primary or related domain route.
    domains: [platform]
    runner: changed-coverage
    automatic: true
  - id: docs-frontmatter
    kind: guard
    level: L0
    description: Validate structured frontmatter and cross-links for authoritative domain and contract pages.
    domains: [platform]
    runner: project-model
    automatic: true
  - id: evidence-provenance
    kind: guard
    level: L1
    description: Validate evidence identity, freshness fields, artifact hashes, and claim coverage before promotion.
    domains: [platform]
    runner: evidence-provenance
    automatic: true
  - id: engine-suites
    kind: contract
    level: L1
    description: Build fresh test output and run affected OEngine suites, expanding to the full set when required.
    domains: [platform]
    runner: engine-suites
    config:
      cwd: OEngine
      build: npm run build:test
      timeoutMs: 900000
    automatic: true
  - id: validation-suites
    kind: contract
    level: L1
    description: Typecheck and test the validation host, artifact protocol, registry, and claim policy.
    domains: [platform]
    runner: validation-suites
    config:
      cwd: validation
      commands:
        - npm run typecheck
        - npm test
      timeoutMs: 300000
    automatic: true
