schemaVersion: 2
checks:
  - id: tooling-suites
    kind: contract
    level: L1
    description: Exercise document, navigation, registry, build identity and machine reporting regressions through current tools.
    domains: [platform]
    runner: tooling-suites
    automatic: true
  - id: model
    kind: contract
    level: L0
    description: Parse and validate domains, checks, workstreams, profiles, workloads, and case-local manifests.
    domains: [platform]
    runner: project-model
    automatic: true
  - id: registry
    kind: contract
    level: L1
    description: Generate and validate the runner registry from case-local manifests.
    domains: [platform, virtual-assets, visibility, frame-runtime]
    runner: generated-registry
    automatic: true
  - id: changed-coverage
    kind: guard
    level: L0
    description: Require existing changed files to match a declared primary or related domain route.
    domains: [platform]
    runner: changed-coverage
    automatic: true
  - id: engine-suites
    kind: contract
    level: L1
    description: Build fresh test output and run affected OEngine suites, expanding to the full set when required.
    domains: [platform]
    runner: engine-suites
    config:
      cwd: OEngine
      build: npm run build:test
      timeoutMs: 900000
    automatic: true
  - id: validation-suites
    kind: contract
    level: L1
    description: Typecheck and test the validation host, artifact protocol and registry.
    domains: [platform]
    runner: validation-suites
    config:
      cwd: validation
      commands:
        - npm run typecheck
        - npm test
      timeoutMs: 300000
    automatic: true
