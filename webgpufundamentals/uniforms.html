<!doctype html>
<!-- 声明这是 HTML5 文档。 -->
<html lang="zh-CN">
<head>
  <!-- 使用 UTF-8，确保中文界面和注释正常显示。 -->
  <meta charset="utf-8">
  <!-- 让页面在不同尺寸的屏幕上正确缩放。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebGPU Uniforms：颜色、缩放和偏移</title>

  <style>
    /* 统一页面颜色和字体变量，方便集中调整视觉风格。 */
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      --page-bg: #0d1118;
      --panel-bg: #151b25;
      --border: #303a4b;
      --text: #edf3ff;
      --muted: #aab7ca;
      --accent: #62d2ff;
    }

    /* 使用 border-box 后，元素宽度会包含 padding 和 border。 */
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: var(--page-bg);
      color: var(--text);
    }

    /* 页面主体在宽屏下分成 Canvas 和控制区两列。 */
    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(1120px, 100%);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(26px, 4vw, 40px);
    }

    .intro {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.7;
    }

    /* 用一行短流程强化 WebGL 与 WebGPU 的核心差异。 */
    .comparison {
      display: grid;
      gap: 6px;
      margin-bottom: 18px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #111722;
      color: #c6d2e5;
      font: 14px/1.5 ui-monospace, "Cascadia Code", monospace;
    }

    .comparison strong {
      color: var(--accent);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 18px;
      align-items: start;
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #080b11;
    }

    .controls {
      display: grid;
      gap: 16px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel-bg);
    }

    .control {
      display: grid;
      gap: 7px;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: #d9e3f3;
      font-size: 14px;
    }

    output {
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    input[type="color"] {
      width: 100%;
      height: 38px;
      padding: 2px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: transparent;
      cursor: pointer;
    }

    button {
      padding: 9px 12px;
      border: 1px solid #436079;
      border-radius: 8px;
      color: var(--text);
      background: #203247;
      cursor: pointer;
    }

    button:hover {
      background: #29435e;
    }

    .values {
      margin: 0;
      padding: 11px;
      overflow-x: auto;
      border-radius: 8px;
      color: #b9e7ff;
      background: #0b1018;
      font: 12px/1.6 ui-monospace, "Cascadia Code", monospace;
      white-space: pre-wrap;
    }

    #status {
      margin-top: 12px;
      color: #92a3bb;
      font-size: 14px;
    }

    #error {
      display: none;
      margin-top: 12px;
      padding: 12px 14px;
      border: 1px solid #954556;
      border-radius: 8px;
      color: #ffdce2;
      background: #351a22;
      line-height: 1.6;
    }

    /* 窄屏时改成单列，避免控制面板挤压 Canvas。 */
    @media (max-width: 780px) {
      .workspace {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>WebGPU Uniforms</h1>
    <p class="intro">
      修改右侧控件，观察 JavaScript 如何通过一个 Uniform Buffer 控制 Shader 中的颜色、缩放和偏移。
    </p>

    <!-- 这两行是本章最重要的 WebGL / WebGPU 心智模型对照。 -->
    <div class="comparison">
      <div><strong>WebGL：</strong>gl.uniform*() → Shader 变量</div>
      <div><strong>WebGPU：</strong>Float32Array → GPUBuffer → BindGroup → Shader</div>
    </div>

    <div class="workspace">
      <!-- WebGPU 把最终颜色写入这个 Canvas。 -->
      <canvas aria-label="由 Uniform 控制的 WebGPU 三角形"></canvas>

      <!-- 控件只修改 CPU 侧的数值，然后触发一次重新绘制。 -->
      <section class="controls" aria-label="Uniform 控制面板">
        <label class="control">
          <span class="control-header"><span>颜色 color</span></span>
          <input id="color" type="color" value="#45c5ff">
        </label>

        <label class="control">
          <span class="control-header">
            <span>缩放 scale</span>
            <output id="scale-output">0.65</output>
          </span>
          <input id="scale" type="range" min="0.15" max="0.95" step="0.01" value="0.65">
        </label>

        <label class="control">
          <span class="control-header">
            <span>水平偏移 offset.x</span>
            <output id="x-output">0.00</output>
          </span>
          <input id="offset-x" type="range" min="-0.8" max="0.8" step="0.01" value="0">
        </label>

        <label class="control">
          <span class="control-header">
            <span>垂直偏移 offset.y</span>
            <output id="y-output">0.00</output>
          </span>
          <input id="offset-y" type="range" min="-0.8" max="0.8" step="0.01" value="0">
        </label>

        <button id="reset" type="button">恢复默认值</button>

        <!-- 用于观察写入 Float32Array 的 8 个浮点数。 -->
        <pre id="values" class="values"></pre>
      </section>
    </div>

    <div id="status">正在初始化 WebGPU…</div>
    <div id="error" role="alert"></div>
  </main>

  <script type="module">
    // Uniform 结构体在 JavaScript 和 WGSL 两侧必须拥有相同的字段顺序。
    // 本例布局如下：
    // color  -> Float32 索引 0～3，共 16 字节
    // scale  -> Float32 索引 4～5，共  8 字节
    // offset -> Float32 索引 6～7，共  8 字节
    // 合计 8 个 f32，也就是 8 × 4 = 32 字节。
    const COLOR_OFFSET = 0;
    const SCALE_OFFSET = 4;
    const POSITION_OFFSET = 6;
    const UNIFORM_BUFFER_SIZE = 32;

    async function main() {
      // navigator.gpu 是浏览器提供的 WebGPU 入口。
      // requestAdapter() 让浏览器选择一个合适的物理 GPU/图形后端。
      const adapter = await navigator.gpu?.requestAdapter();
      if (!adapter) {
        throw new Error("当前浏览器没有可用的 WebGPU Adapter。");
      }

      // GPUDevice 是创建 Buffer、Shader、Pipeline 和提交工作的核心对象。
      const device = await adapter.requestDevice();

      // 找到 Canvas，并取得 WebGPU 专用的绘图上下文。
      const canvas = document.querySelector("canvas");
      const context = canvas.getContext("webgpu");
      if (!context) {
        throw new Error("无法从 Canvas 获取 WebGPU Context。");
      }

      // 获取浏览器推荐的 Canvas Texture 格式，常见值是 bgra8unorm。
      const presentationFormat = navigator.gpu.getPreferredCanvasFormat();

      // 配置 Canvas，使它之后可以从当前 GPUDevice 取得可渲染纹理。
      context.configure({
        device,
        format: presentationFormat,
        alphaMode: "premultiplied",
      });

      // 创建同时包含 vertex shader 和 fragment shader 的 WGSL 模块。
      const shaderModule = device.createShaderModule({
        label: "使用 Uniform 的三角形 Shader",
        code: /* wgsl */ `
          // 这个结构体描述 GPUBuffer 内部 32 字节数据的含义。
          // JavaScript 中的 Float32Array 必须按同样顺序填写。
          struct Uniforms {
            color: vec4f,
            scale: vec2f,
            offset: vec2f,
          };

          // 声明一个只读 uniform 变量。
          // @group(0) 对应 pass.setBindGroup(0, bindGroup)。
          // @binding(0) 对应 BindGroup entries 中的 binding: 0。
          @group(0) @binding(0) var<uniform> uniforms: Uniforms;

          @vertex
          fn vs(@builtin(vertex_index) vertexIndex: u32)
              -> @builtin(position) vec4f {
            // 为了专注 Uniform，本例仍然把三个顶点直接写在 Shader 中，
            // 暂时不使用 Vertex Buffer。
            let positions = array<vec2f, 3>(
              vec2f( 0.0,  0.55),
              vec2f(-0.5, -0.45),
              vec2f( 0.5, -0.45),
            );

            // uniform.scale 控制大小，uniform.offset 控制位置。
            // 在一次 draw(3) 中，三个顶点读取到的是同一份 Uniform。
            let position =
                positions[vertexIndex] * uniforms.scale + uniforms.offset;

            return vec4f(position, 0.0, 1.0);
          }

          @fragment
          fn fs() -> @location(0) vec4f {
            // 每个片元读取同一个 uniform.color，
            // 所以三角形是纯色，而不是上一章的顶点插值渐变色。
            return uniforms.color;
          }
        `,
      });

      // Pipeline 把 Shader 入口、输出格式和图元类型固定下来。
      const pipeline = device.createRenderPipeline({
        label: "Uniform 三角形渲染管线",
        // auto 会根据 WGSL 中的 @group/@binding 自动生成绑定布局。
        layout: "auto",
        vertex: {
          module: shaderModule,
          entryPoint: "vs",
        },
        fragment: {
          module: shaderModule,
          entryPoint: "fs",
          targets: [{ format: presentationFormat }],
        },
        primitive: {
          topology: "triangle-list",
        },
      });

      // 创建真正存放 Uniform 数据的 GPUBuffer。
      const uniformBuffer = device.createBuffer({
        label: "颜色、缩放和偏移 Uniform Buffer",
        size: UNIFORM_BUFFER_SIZE,
        usage:
          // 允许 Shader 通过 var<uniform> 读取这块 Buffer。
          GPUBufferUsage.UNIFORM |
          // 允许 queue.writeBuffer() 把 CPU 数据复制进来。
          GPUBufferUsage.COPY_DST,
      });

      // Float32Array 位于 CPU/JavaScript 内存中。
      // 它只是上传前的临时数据容器，不是 GPUBuffer 本身。
      const uniformValues = new Float32Array(UNIFORM_BUFFER_SIZE / 4);

      // BindGroup 负责把 uniformBuffer 接到 Shader 的 group 0、binding 0。
      const bindGroup = device.createBindGroup({
        label: "Uniform 三角形绑定组",
        // 取得 Pipeline 根据 @group(0) 推导出的第 0 组布局。
        layout: pipeline.getBindGroupLayout(0),
        entries: [{
          // 对应 WGSL 中的 @binding(0)。
          binding: 0,
          resource: {
            buffer: uniformBuffer,
          },
        }],
      });

      // 缓存页面控件，后续 render() 从这些控件读取最新值。
      const controls = {
        color: document.querySelector("#color"),
        scale: document.querySelector("#scale"),
        offsetX: document.querySelector("#offset-x"),
        offsetY: document.querySelector("#offset-y"),
        scaleOutput: document.querySelector("#scale-output"),
        xOutput: document.querySelector("#x-output"),
        yOutput: document.querySelector("#y-output"),
        values: document.querySelector("#values"),
      };

      // 将 #rrggbb 格式的 HTML 颜色转成 Shader 使用的 0～1 浮点数。
      function hexToRgb(hex) {
        return [
          Number.parseInt(hex.slice(1, 3), 16) / 255,
          Number.parseInt(hex.slice(3, 5), 16) / 255,
          Number.parseInt(hex.slice(5, 7), 16) / 255,
        ];
      }

      // 让 Canvas 的内部像素尺寸跟随 CSS 尺寸和设备像素比。
      function resizeCanvas() {
        const pixelRatio = window.devicePixelRatio || 1;
        const maxSize = device.limits.maxTextureDimension2D;
        const width = Math.max(
          1,
          Math.min(Math.round(canvas.clientWidth * pixelRatio), maxSize),
        );
        const height = Math.max(
          1,
          Math.min(Math.round(canvas.clientHeight * pixelRatio), maxSize),
        );

        if (canvas.width === width && canvas.height === height) {
          return;
        }

        canvas.width = width;
        canvas.height = height;
      }

      // 把控件中的值整理成与 WGSL Uniforms 完全一致的内存布局。
      function updateUniformValues() {
        const [red, green, blue] = hexToRgb(controls.color.value);
        const scale = Number(controls.scale.value);
        const offsetX = Number(controls.offsetX.value);
        const offsetY = Number(controls.offsetY.value);

        // color: vec4f，占据 Float32 索引 0～3。
        uniformValues.set([red, green, blue, 1], COLOR_OFFSET);

        // 根据 Canvas 宽高比修正 x 缩放，避免三角形在宽屏上被拉宽。
        const aspect = canvas.width / canvas.height;
        uniformValues.set([scale / aspect, scale], SCALE_OFFSET);

        // offset: vec2f，占据 Float32 索引 6～7。
        uniformValues.set([offsetX, offsetY], POSITION_OFFSET);

        // 同步页面上的数值显示，帮助观察 Float32Array 的真实内容。
        controls.scaleOutput.value = scale.toFixed(2);
        controls.xOutput.value = offsetX.toFixed(2);
        controls.yOutput.value = offsetY.toFixed(2);
        controls.values.textContent =
          `Float32Array(8)\n[${Array.from(uniformValues)
            .map((value) => value.toFixed(3))
            .join(", ")}]`;
      }

      // 录制并提交一帧绘制命令。
      function render() {
        resizeCanvas();
        updateUniformValues();

        // 把 CPU 侧 Float32Array 的全部 32 字节复制进 GPUBuffer。
        // Pipeline 和 BindGroup 不需要因为数据变化而重新创建。
        device.queue.writeBuffer(uniformBuffer, 0, uniformValues);

        // 获取当前帧 Canvas Texture 的视图，作为颜色附件。
        const canvasView = context.getCurrentTexture().createView();

        // CommandEncoder 只是在 CPU 侧录制 GPU 将来要执行的命令。
        const encoder = device.createCommandEncoder({
          label: "Uniform 示例命令编码器",
        });

        const pass = encoder.beginRenderPass({
          label: "Uniform 示例渲染通道",
          colorAttachments: [{
            view: canvasView,
            clearValue: { r: 0.025, g: 0.035, b: 0.055, a: 1 },
            loadOp: "clear",
            storeOp: "store",
          }],
        });

        // 先选择 Pipeline，再把 group 0 设置为刚刚创建的 BindGroup。
        pass.setPipeline(pipeline);
        pass.setBindGroup(0, bindGroup);

        // 执行 3 个顶点，组成一个三角形。
        pass.draw(3);
        pass.end();

        // finish() 生成 CommandBuffer，submit() 把它交给 GPU 异步执行。
        device.queue.submit([encoder.finish()]);
      }

      // 任意控件变化都重新上传 Uniform 并绘制一帧。
      for (const input of [
        controls.color,
        controls.scale,
        controls.offsetX,
        controls.offsetY,
      ]) {
        input.addEventListener("input", render);
      }

      // 恢复示例的初始值。
      document.querySelector("#reset").addEventListener("click", () => {
        controls.color.value = "#45c5ff";
        controls.scale.value = "0.65";
        controls.offsetX.value = "0";
        controls.offsetY.value = "0";
        render();
      });

      // Canvas 显示尺寸变化时，重新计算像素尺寸和宽高比 Uniform。
      new ResizeObserver(render).observe(canvas);

      // 主动绘制第一帧；ResizeObserver 之后也会至少触发一次。
      render();
      document.querySelector("#status").textContent =
        "运行中：控件变化会更新 Float32Array，并通过 writeBuffer 上传 32 字节 Uniform 数据。";
    }

    // 集中处理初始化或运行时异常。
    main().catch((error) => {
      console.error(error);
      const errorElement = document.querySelector("#error");
      errorElement.textContent = "WebGPU 初始化失败：" + error.message;
      errorElement.style.display = "block";
      document.querySelector("#status").textContent = "运行失败";
    });
  </script>
</body>
</html>
