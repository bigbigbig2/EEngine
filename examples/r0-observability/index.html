<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OEngine R0 Observability</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">OBS-01 / OBS-03 / OBS-04 smoke</p>
        <h1>R0 Observability</h1>
        <p>初始化真实 OEngine WebGPU 设备，预热 4 帧并采集 20 帧 GraphicsContext 更新证据。</p>
      </header>
      <section class="status-card" aria-live="polite">
        <span id="status-dot" class="status-dot"></span>
        <div>
          <strong id="status">正在初始化 WebGPU…</strong>
          <p id="detail">等待 adapter、device 和 OEngine 静态资源。</p>
        </div>
      </section>
      <canvas id="gpu-canvas" width="640" height="360" aria-label="OEngine WebGPU canvas"></canvas>
      <section class="grid" aria-label="Benchmark summary">
        <article><span>Measured</span><strong id="frames">0 / 20</strong></article>
        <article><span>CPU frame P50</span><strong id="cpu-p50">—</strong></article>
        <article><span>Submit mean</span><strong id="submit-mean">—</strong></article>
        <article><span>Upload P50</span><strong id="upload-p50">—</strong></article>
      </section>
      <section>
        <div class="result-heading">
          <h2>Result JSON</h2>
          <button id="download" type="button" disabled>下载结果</button>
        </div>
        <pre id="result">采集完成后显示 environment、frames 和 P50/P95/P99。</pre>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
