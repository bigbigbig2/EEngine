<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" href="data:," />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OEngine · Pine Forest Geometry</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="workspace">
      <div class="stage">
        <canvas id="viewport" aria-label="Pine Forest geometry viewport"></canvas>
        <div class="viewbar" role="toolbar" aria-label="视图控制">
          <button type="button" id="center-view" title="回到模型中心">中心</button>
          <button type="button" id="overview-view" title="查看整个模型">全览</button>
          <div class="view-modes" role="group" aria-label="几何分色模式">
            <button type="button" id="meshlet-view" aria-pressed="true" title="按 Meshlet ID 分色">分块</button>
            <button type="button" id="solid-view" aria-pressed="false" title="单色 Unlit">单色</button>
          </div>
        </div>
        <div class="stage-caption">PINE FOREST <span id="color-caption">MESHLET ID</span></div>
      </div>
      <aside id="inspector" aria-label="Pine Forest performance inspector">
        <header class="panel-header">
          <div><small>OENGINE / GEOMETRY LAB</small><h1>Pine Forest</h1></div>
        </header>
        <div class="panel-body">
          <div class="load-status"><span id="load-state">初始化</span><span id="progress-caption">0 / -- primitive</span></div>
          <div class="progress"><i id="progress-fill"></i></div>
          <div id="summary" class="summary"></div>
          <nav id="tabs" aria-label="Inspector sections"></nav>
          <div id="panel-content" class="panel-content"></div>
          <footer class="panel-actions">
            <button type="button" id="export" title="导出当前加载与运行时数据">导出 JSON</button>
            <button type="button" id="reload" title="重新加载模型">重新加载</button>
            <button type="button" id="release" title="释放模型与 WebGPU 资源">释放</button>
          </footer>
        </div>
      </aside>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
