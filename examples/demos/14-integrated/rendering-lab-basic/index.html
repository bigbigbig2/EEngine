<!doctype html>
<html lang="zh-CN">
  <head>
    <link rel="icon" href="data:," />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OEngine · Visibility to HDR Lab</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="workspace">
      <div class="stage">
        <canvas id="viewport" aria-label="Dungeon virtual geometry viewport"></canvas>
        <div class="viewbar" role="toolbar" aria-label="视图控制">
          <button type="button" id="center-view">中心</button>
          <button type="button" id="overview-view">全览</button>
          <div class="view-modes" role="group" aria-label="显示模式">
            <button type="button" id="meshlet-view" aria-pressed="false">分块</button>
            <button type="button" id="solid-view" aria-pressed="true">PBR</button>
          </div>
        </div>
        <div class="stage-caption">DUNGEON / WEB COOK <span id="color-caption">PBR</span></div>
      </div>
      <aside id="inspector" aria-label="Web geometry inspector">
        <header class="panel-header"><div class="panel-heading"><small>OENGINE / GEOMETRY LAB</small><h1>Visibility → HDR</h1></div><button type="button" id="panel-toggle" aria-controls="panel-body" aria-expanded="true">收起</button></header>
        <div id="panel-body" class="panel-body">
          <div class="load-status"><span id="load-state">初始化</span><span id="progress-caption">0 / -- primitive</span></div>
          <div class="progress"><i id="progress-fill"></i></div>
          <div id="summary" class="summary"></div>
          <details class="pipeline-config" open>
            <summary>固定渲染路径 <span>后处理效果关闭</span></summary>
            <div>Visibility → Sparse Material Resolve → PBR Direct + IBL → HDR → Final Output</div>
          </details>
          <label class="gpu-counter-control"><span>GPU 像素计数 <small>诊断采样会增加开销</small></span><input id="gpu-pixel-counters" type="checkbox" /></label>
          <nav id="tabs" aria-label="Inspector sections"></nav>
          <div id="panel-content" class="panel-content"></div>
          <footer class="panel-actions">
            <button type="button" id="export">导出 JSON</button>
            <button type="button" id="reload">重新加载</button>
            <button type="button" id="release">释放</button>
          </footer>
        </div>
      </aside>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
