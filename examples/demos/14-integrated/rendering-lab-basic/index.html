<!doctype html>
<html lang="zh-CN">
  <head>
    <link rel="icon" href="data:," />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OEngine · Virtual Geometry PBR Lab</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="workspace">
      <div class="stage">
        <canvas id="viewport" aria-label="Dungeon virtual geometry viewport"></canvas>
        <div class="viewbar" role="toolbar" aria-label="视图控制">
          <button type="button" id="center-view">中心</button>
          <button type="button" id="overview-view">全览</button>
          <div class="view-modes" role="group" aria-label="显示模式">
            <button type="button" id="meshlet-view" aria-pressed="false">分块</button>
            <button type="button" id="solid-view" aria-pressed="true">PBR</button>
          </div>
        </div>
        <div class="stage-caption">DUNGEON / WEB COOK <span id="color-caption">PBR</span></div>
      </div>
      <aside id="inspector" aria-label="Web geometry inspector">
        <header class="panel-header"><div class="panel-heading"><small>OENGINE / GEOMETRY LAB</small><h1>Virtual Geometry · PBR</h1></div><button type="button" id="panel-toggle" aria-controls="panel-body" aria-expanded="true">收起</button></header>
        <div id="panel-body" class="panel-body">
          <div class="load-status"><span id="load-state">初始化</span><span id="progress-caption">0 / -- primitive</span></div>
          <div class="progress"><i id="progress-fill"></i></div>
          <div id="summary" class="summary"></div>
          <details class="effects" open>
            <summary>渲染效果 <span>独立开关，用于成本对照</span></summary>
            <div id="effect-controls" class="effect-controls">
              <label><span>阴影</span><input type="checkbox" data-feature="shadows" /></label>
              <label><span>漫反射</span><select id="diffuse-mode"><option value="off">关闭</option><option value="gtao">GTAO</option><option value="ssgi">SSGI</option></select></label>
              <label><span>屏幕空间反射</span><input type="checkbox" data-feature="screenSpaceReflections" /></label>
              <label><span>时域抗锯齿</span><input type="checkbox" data-feature="temporalAntiAliasing" /></label>
              <label><span>Bloom</span><input type="checkbox" data-feature="bloom" /></label>
              <label><span>自动曝光</span><input type="checkbox" data-feature="automaticExposure" /></label>
              <label><span>运动模糊</span><input type="checkbox" data-feature="motionBlur" /></label>
              <label><span>锐化</span><input type="checkbox" data-feature="sharpening" /></label>
            </div>
          </details>
          <label class="gpu-counter-control"><span>GPU 像素计数 <small>诊断采样会增加开销</small></span><input id="gpu-pixel-counters" type="checkbox" /></label>
          <nav id="tabs" aria-label="Inspector sections"></nav>
          <div id="panel-content" class="panel-content"></div>
          <footer class="panel-actions">
            <button type="button" id="export">导出 JSON</button>
            <button type="button" id="reload">重新加载</button>
            <button type="button" id="release">释放</button>
          </footer>
        </div>
      </aside>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
