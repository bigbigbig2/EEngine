<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OEngine · Rendering Lab</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="viewport" aria-label="OEngine Rendering Lab viewport"></canvas>
