<!doctype html>
<html lang="zh-CN">
  <head>
    <link rel="icon" href="data:," />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EEngine Next Renderer Showcase</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="showcase">
      <canvas id="viewport" aria-label="Dungeon 三维场景"></canvas>
      <div class="topbar">
        <div class="brand"><span class="mark">E</span><span>EEngine Next</span><strong>Renderer Showcase</strong></div>
        <div class="hud" aria-live="polite">
          <span id="scene-state">等待启动</span>
          <span id="fps-readout">-- FPS</span>
        </div>
      </div>
      <button id="start-scene" class="start-scene" type="button">启动 Dungeon</button>
      <div class="camera-bar" role="toolbar" aria-label="相机视角">
        <button id="overview-view" type="button">全景</button>
        <button id="detail-view" type="button">近景</button>
      </div>
      <button id="panel-toggle" class="panel-toggle" type="button" aria-controls="control-panel" aria-expanded="true">调试面板</button>
      <aside id="control-panel" class="control-panel" aria-label="Next Renderer 调试面板">
        <header class="panel-header">
          <div>
            <span class="eyebrow">LIVE NEXT RENDERER</span>
            <h1>Dungeon</h1>
            <p>dungeon_warkarma.glb</p>
          </div>
          <span id="path-badge" class="status-badge">等待首帧</span>
        </header>
        <div class="panel-scroll">
          <details open>
            <summary>渲染效果</summary>
            <div class="control-list">
              <label class="switch-row"><span>XeGTAO</span><input id="toggle-gtao" type="checkbox" checked /><i></i></label>
              <label class="switch-row"><span>FSR3</span><input id="toggle-fsr3" type="checkbox" checked /><i></i></label>
              <label class="switch-row"><span>Bloom</span><input id="toggle-bloom" type="checkbox" checked /><i></i></label>
              <label class="switch-row"><span>HZB</span><input id="toggle-hzb" type="checkbox" checked /><i></i></label>
              <label class="switch-row"><span>锥体裁剪</span><input id="toggle-cone" type="checkbox" checked /><i></i></label>
              <label class="switch-row"><span>自动旋转</span><input id="toggle-rotate" type="checkbox" /><i></i></label>
            </div>
          </details>
          <details open>
            <summary>画面参数</summary>
            <div class="control-list">
              <label class="range-row" for="render-scale"><span><b>内部渲染比例</b><output id="render-scale-value">1.00×</output></span><input id="render-scale" type="range" min="0.5" max="1" step="0.05" value="1" /></label>
              <label class="range-row" for="sse-threshold"><span><b>几何 SSE</b><output id="sse-value">4.0</output></span><input id="sse-threshold" type="range" min="1" max="12" step="0.5" value="4" /></label>
              <label class="range-row" for="sun-azimuth"><span><b>太阳方位角</b><output id="sun-azimuth-value">30°</output></span><input id="sun-azimuth" type="range" min="-180" max="180" step="1" value="30" /></label>
              <label class="range-row" for="sun-elevation"><span><b>太阳高度角</b><output id="sun-elevation-value">63°</output></span><input id="sun-elevation" type="range" min="10" max="85" step="1" value="63" /></label>
              <label class="range-row" for="sun-intensity"><span><b>太阳强度</b><output id="sun-intensity-value">1.50×</output></span><input id="sun-intensity" type="range" min="0" max="2" step="0.05" value="1.5" /></label>
            </div>
          </details>
          <details>
            <summary>实时诊断</summary>
            <div class="control-list">
              <label class="switch-row"><span>GPU 采样</span><input id="toggle-profiler" type="checkbox" /><i></i></label>
              <div class="metric-grid">
                <span>CPU Frame</span><strong id="cpu-readout">--</strong>
                <span>GPU Frame</span><strong id="gpu-readout">--</strong>
                <span>实例</span><strong id="instance-readout">--</strong>
                <span>内部尺寸</span><strong id="resolution-readout">--</strong>
              </div>
              <div id="diagnostic-state" class="diagnostic-state">采样关闭</div>
            </div>
          </details>
        </div>
        <footer class="panel-footer">
          <button id="export-diagnostics" type="button">导出诊断 JSON</button>
        </footer>
      </aside>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
