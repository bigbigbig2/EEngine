<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OEngine R3-B Hierarchical Work Generation</title>
    <style>
      body { margin: 0; background: #0b1020; color: #edf2ff; font: 15px/1.55 system-ui, sans-serif; }
      main { max-width: 1040px; margin: 0 auto; padding: 36px 20px 72px; }
      section { margin: 18px 0; padding: 20px; border: 1px solid #2a3c62; border-radius: 14px; background: #121a2e; }
      h1, h2 { margin-top: 0; }
      .running { color: #ffd479; } .ok { color: #7ee2a8; } .error { color: #ff8795; }
      pre { overflow: auto; white-space: pre-wrap; word-break: break-word; }
      button { padding: 9px 14px; color: #08111f; background: #8bc8ff; border: 0; border-radius: 8px; cursor: pointer; }
      button:disabled { opacity: .45; cursor: default; }
    </style>
  </head>
  <body>
    <main>
      <h1>R3-B · Cluster Hierarchy GPU Producer</h1>
      <p>R2 resident Instance/Geometry/Cluster tables → InstanceCull → root → ping/pong Frustum + SSE → VisibleCluster readback test consumer。</p>
      <section>
        <h2 id="status" class="running">正在运行 GPU/CPU selected-set 对齐……</h2>
        <p id="summary">初始化 WebGPU、Cooker 与 GPU resident tables。</p>
        <button id="download" type="button" disabled>下载 JSON 结果</button>
      </section>
      <section><h2>结果</h2><pre id="result">等待结果……</pre></section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
