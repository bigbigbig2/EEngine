<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>OEngine Benchmark B</title><link rel="stylesheet" href="../benchmark-shared/style.css" /></head>
  <body><main>
    <p class="eyebrow">OBS-02 · minimum PBR/IBL baseline</p><h1 id="page-title">Benchmark B</h1>
    <section class="status-card" aria-live="polite"><span id="status-dot" class="status-dot"></span><div><strong id="status">正在读取 manifest…</strong><p id="detail">等待固定输入。</p></div></section>
    <section class="meta"><article><span>Baseline role</span><strong id="role">—</strong></article><article><span>Profile</span><strong id="profile">—</strong></article><article><span>Progress</span><strong id="progress">0 / —</strong></article><article><span>Gate</span><strong id="gate">—</strong></article><article><span>Capability</span><strong id="capability">—</strong></article></section>
    <p id="counts">场景尚未构建。</p><div class="canvas-wrap"><canvas id="gpu-canvas" aria-label="OEngine Benchmark B output"></canvas></div>
    <section class="metrics"><article><span>CPU frame P50</span><strong id="cpu-p50">—</strong></article><article><span>Submit mean</span><strong id="submit-mean">—</strong></article></section>
    <section class="panel"><h2>当前能力边界</h2><ul id="limitations"></ul></section>
    <details class="panel"><summary>冻结 Manifest</summary><pre id="manifest"></pre></details>
    <section class="panel"><div class="result-heading"><h2>Schema v3 Result</h2><button id="download" disabled>下载结果</button></div><pre id="result">采集完成后显示结果。</pre></section>
  </main><script type="module" src="./main.ts"></script></body>
</html>
