<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>OEngine R4-A-04 Hardware Debug Resolve</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; background: #0d1116; color: #edf1f5; }
      main { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 48px; }
      h1, h2 { margin: 0; letter-spacing: 0; }
      h1 { font-size: 28px; }
      h2 { font-size: 16px; }
      .lead { color: #aeb8c2; margin: 8px 0 20px; }
      .layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
      .panel { border: 1px solid #39434d; border-radius: 6px; background: #171d23; padding: 16px; }
      #gpu-canvas { display: block; width: 100%; aspect-ratio: 16 / 9; background: #06090c; }
      #failure-strip { display: block; width: 100%; height: 72px; margin-top: 12px; image-rendering: pixelated; background: #06090c; }
      .running { color: #f0c96b; }
      .ok { color: #74d99f; }
      .error { color: #ff8993; }
      pre { margin: 12px 0 0; max-height: 620px; overflow: auto; white-space: pre-wrap; word-break: break-word; color: #cbd5df; font-size: 12px; }
      button { margin-top: 12px; padding: 8px 12px; border: 0; border-radius: 6px; background: #8bc8ff; color: #07111b; cursor: pointer; }
      button:disabled { opacity: .45; cursor: default; }
      @media (max-width: 840px) { .layout { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <h1>R4-A-04 Hardware Debug Resolve</h1>
      <p class="lead">Production packed glTF VisibilityKey heatmap and fail-visible lookup diagnostics.</p>
      <div class="layout">
        <section class="panel">
          <canvas id="gpu-canvas" width="768" height="432"></canvas>
          <canvas id="failure-strip" width="16" height="1"></canvas>
        </section>
        <section class="panel">
          <h2 id="status" class="running">Running WebGPU validation...</h2>
          <button id="download" type="button" disabled>Download JSON</button>
          <pre id="result">Waiting for production Renderer and GPU injection evidence...</pre>
        </section>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
