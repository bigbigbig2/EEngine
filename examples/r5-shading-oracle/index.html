<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>OEngine R5 FX-03 IBL Shading Oracle</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; background: #0a0f16; color: #e8eef5; }
      main { width: min(1320px, calc(100% - 32px)); margin: auto; padding: 20px 0; }
      .layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; }
      .panel { padding: 12px; border: 1px solid #334253; border-radius: 8px; background: #121b25; }
      canvas { display: block; width: 100%; aspect-ratio: 4 / 3; background: #000; }
      pre { max-height: 700px; overflow: auto; font-size: 11px; white-space: pre-wrap; }
      .ok { color: #75dfa4; } .error { color: #ff8b96; } .running { color: #efc86d; }
      @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body><main>
    <h1>R5 FX-03 · IBL Alignment / B-shading-oracle</h1>
    <p>Damaged Helmet · fixed linear HDR octahedral environment · no direct lights/post effects.</p>
    <div class="layout">
      <section class="panel"><canvas id="gpu-canvas" width="960" height="720"></canvas></section>
      <section class="panel"><h2 id="status" class="running">Running WebGPU Gate…</h2><p id="detail"></p><pre id="result"></pre></section>
    </div>
    <script type="module" src="./main.ts"></script>
  </main></body>
</html>
