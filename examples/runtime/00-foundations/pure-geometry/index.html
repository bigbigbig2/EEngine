<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>OEngine · 00 Foundations · Pure Geometry</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0b1220; }
      body { position: relative; font-family: system-ui, sans-serif; }
      canvas { display: block; width: 100%; height: 100%; }
      .panel { position: fixed; left: 16px; top: 16px; width: 250px; padding: 14px; border: 1px solid #ffffff2b; border-radius: 10px; color: #dce7f5; background: #101b2bd9; backdrop-filter: blur(10px); font-size: 12px; }
      .panel h1 { margin: 0 0 8px; font-size: 15px; }
      .panel h2 { margin: 14px 0 6px; color: #8fb8e8; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
      .panel p { margin: 4px 0; line-height: 1.4; }
      .panel pre { margin: 0; white-space: pre-wrap; color: #cbd5e1; font: 11px/1.45 ui-monospace, Consolas, monospace; }
      .status { color: #a7f3d0; }
      .status[data-fixture-status="failed"], .status[data-fixture-status="device-lost"] { color: #fecaca; }
      .tools { position: fixed; right: 16px; top: 16px; display: flex; gap: 6px; }
      button { border: 1px solid #ffffff2b; border-radius: 6px; padding: 6px 9px; color: #dce7f5; background: #101b2bd9; cursor: pointer; }
      .help { position: fixed; right: 16px; bottom: 16px; padding: 8px 10px; color: #cbd5e1; background: #101827c7; font-size: 12px; }
    </style>
  </head>
  <body>
    <canvas id="gpu-canvas" aria-label="Pure geometry cube and plane"></canvas>
    <section class="panel" aria-label="Pure geometry case information">
      <h1>00 Foundations · 01 Pure Geometry</h1>
      <p>Cube + Plane 的最小完整渲染路径。</p>
      <h2>Pipeline</h2>
      <pre>Source Geometry
  ↓
Cook
  ↓
Packed Scene
  ↓
Minimal Renderer</pre>
      <h2>Baseline</h2>
      <pre>DPR 1
Shadow OFF · TAA OFF
AO OFF · SSR OFF
Inspector OFF</pre>
      <h2>Runtime</h2>
      <p id="scene-status" class="status" data-fixture-status="booting">正在初始化…</p>
      <pre id="scene-metrics">等待数据…</pre>
    </section>
    <div class="tools" aria-label="fixture controls">
      <button id="download-json" type="button">导出 JSON</button>
      <button id="capture-png" type="button">截图</button>
      <button id="reset-camera" type="button">重置相机</button>
    </div>
    <div class="help">左键旋转 · 右键平移 · 滚轮缩放</div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
