<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OEngine R2-B Complete Geometry Package</title>
    <style>
      body { margin: 0; color: #edf4ff; background: #07101d; font: 15px/1.55 system-ui, sans-serif; }

  <body>
    <main>
      <h1>R2-B · Complete Geometry Package</h1>

      <section><h2 id="status" class="pending">正在 Cook 与 reopen…</h2><div id="summary"></div></section>
      <section><h2>机器报告</h2><pre id="result"></pre></section>
    </main>
    <script type="module" src="./main.ts"></script>
