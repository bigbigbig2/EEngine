<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OEngine · Basic Cube Scene</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0b1220; }
      body { position: relative; font-family: system-ui, sans-serif; }
      canvas { display: block; width: 100%; height: 100%; }
      .scene-help { position: fixed; left: 16px; bottom: 16px; padding: 8px 12px; border: 1px solid #ffffff2b; border-radius: 8px; color: #dce7f5; background: #101b2bd9; font-size: 12px; backdrop-filter: blur(8px); pointer-events: none; }
      .scene-status { position: fixed; right: 16px; top: 16px; padding: 6px 10px; border-radius: 999px; color: #cdebd7; background: #10351fcc; font-size: 12px; }
    </style>
  </head>
  <body>
    <canvas id="gpu-canvas" aria-label="Basic OEngine cube and plane scene"></canvas>
    <div class="scene-status" id="scene-status">正在初始化 WebGPU…</div>
    <div class="scene-help">拖动旋转 · 滚轮缩放 · 右键平移</div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
