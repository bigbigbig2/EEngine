schemaVersion: 2
claims:
  - id: visibility.gpu-closure
    domain: visibility
    owner: visibility
    statement: GPU work generation and visibility output are consumed by GPU indirect and shading stages without CPU visible-list traversal.
    level: L4
    requiredChecks: [model, registry, evidence-provenance]
    allowedDeclarations: [ImplementationComplete, RuntimeValidated, PipelineFeatureComplete, ADRComplete]
    watch: [OEngine/src/render/passes/**, OEngine/src/render/MeshletBucketRaster.ts, OEngine/src/shaders/**]
  - id: visibility.feature-off
    domain: visibility
    owner: visibility
    statement: Disabled visibility and sparse-shading features remove their work, resources, and submits at frame construction.
    level: L4
    requiredChecks: [registry, changed-coverage, evidence-provenance]
    allowedDeclarations: [ImplementationComplete, RuntimeValidated, PipelineFeatureComplete, ADRComplete]
    watch: [OEngine/src/render/pipeline/**, OEngine/src/render/passes/**, OEngine/src/shaders/**]
