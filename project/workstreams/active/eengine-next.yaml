schemaVersion: 2
id: eengine-next
title: EEngine Next renderer composition and faithful algorithm migration
domain: frame-runtime
state: active
owner: frame-runtime
decision: ADR-0019
goal: Deliver the accepted demand-driven virtualized visibility architecture through six broad modules and faithful, bounded upstream algorithm ports.

currentSlice:
  id: composition-and-program-lifetime
  title: Split the production main-pipeline ownership and establish the product planning seam
  status: active
nextTasks:
  - Continue M1 by moving the main FrameGraph recipe behind a typed product/Provider composition boundary; retain one graph and one submit path.
  - Separate scene publication and recovery/observation ownership from the frame orchestrator without breaking GPU producer-consumer closure.
  - Compare the first recompute/materialize choice using consumer fanout, decode, dispatch, and bandwidth evidence on the 1650 Ti baseline.
  - Keep dynamic world-GI producer feasibility and full XeGTAO/SSSR porting as later gates; do not replace M1 with a GI implementation.

contracts:
  - render-product-work-history-v1
  - claims-and-evidence
  - virtual-geometry-runtime-v1
claims:
  - frame.recovery
  - shading.one-eval
  - shading.pipeline-pruning
  - visibility.gpu-closure
completedMilestones:
  - id: foundation-contract-boundaries
    result: First product, bounded work, temporal-history and program-publication contracts are in production. Remaining adaptive frequency and dynamic exposure choices remain explicit future gates.
  - id: architecture-and-source-preparation
    result: The accepted target, six-module implementation route, pinned candidate survey, and faithful-port policy are documented; no runtime migration is claimed.
  - id: device-and-dynamic-gi-direction
    result: User selected the 1650 and 2060 development machines and dynamic world GI; current hardware is GTX 1650 Ti 4 GiB, i7-10750H, and 16 GiB RAM. Actual second-machine configuration remains to be read.
  - id: first-opaque-product-and-program-boundary
    result: Sparse shading programs now reuse device-scoped compiled pipelines across Scene revisions; publication bindings remain revision-local. The first opaque product plan drives optional Surface allocation; browser performance evidence remains open.
  - id: meshlet-shading-bounded-work-control
    result: Production MeshletWork and ShadingBin allocation now share bounded work preflight and declare their own producer, GPU consumer, counters, overflow and indirect execution; physical ABIs and shader execution remain independent. Browser behavior and performance evidence remain open.
  - id: exact-lighting-history-identity
    result: Lighting history identity now preserves independent light and probe revisions, while geometric GTAO explicitly retains history across lighting-only changes. Stable object identity, local representation invalidation, and dynamic pre-exposure remain open.
  - id: opaque-product-attachment-cost
    result: The finite opaque product plan now accounts for actual HDR and optional Surface attachment formats, and production allocation telemetry reads that same plan. This is a planned footprint, not measured bandwidth or a recompute-versus-materialize decision.
  - id: exposure-history-boundary
    result: Temporal history input rejects a generation mismatch before mutation and invalidates non-rescalable histories when the pre-exposure multiplier changes within one generation. Production still uses multiplier one; dynamic exposure integration remains open.
tasks:
  - id: foundation-contracts
    state: done
    title: Define minimal semantic products, bounded work, stable temporal identity, and program-publication separation
    dependsOn: []
    exitCriteria:
      - Existing production owners and the first real consumers determine the contracts; no speculative full ABI is frozen.
      - Adaptive frequency explicitly identifies the future contract and claim changes required by the current exactly-once semantics.
  - id: composition-and-program-lifetime
    state: active
    title: Split main-pipeline responsibilities and preserve behavior while separating stable programs from revision-local bindings
    dependsOn:
      - foundation-contracts
    exitCriteria:
      - A single production pipeline retains GPU publication, sparse and direct shading, feature-off pruning, and recovery.
  - id: dynamic-gi-producer-feasibility
    state: todo
    title: Prove bounded dynamic geometry and lighting updates reach the world-GI sample producer and probe consumer
    dependsOn:
      - foundation-contracts
    exitCriteria:
      - Source mapping covers movement, insertion and removal, deformation, and light changes with explicit refit or rebuild and history invalidation.
      - The GTX 1650 Ti experiment records update cost, convergence latency, memory, and fallback without requiring hardware RT or a static-only scene.
  - id: first-complete-provider-port
    state: todo
    title: Connect a complete pinned screen-space algorithm to product, work, and temporal consumers
    dependsOn:
      - foundation-contracts
      - composition-and-program-lifetime
    exitCriteria:
      - A bounded source profile includes license notices, stage mapping, WebGPU adaptations, fallback, and focused validation.
      - No required algorithm stage is omitted while claiming the upstream algorithm is complete.
exitChecks:
  - model
  - registry
  - evidence-provenance
requiredEvidence:
  - Source-to-production mappings and focused reference checks for each actually migrated algorithm profile.
  - Existing affected tests and independent browser evidence for changed GPU producer-consumer and lifecycle behavior.
  - Fixed-condition GPU and image evidence before integration or performance claims are promoted.
openGates:
  - Measure actual browser adapters and limits on both machines; derive configurable cache budgets on the 4 GiB baseline and record the second-machine configuration when available.
  - Dynamic geometry and lighting are required; the world-GI sample producer, acceleration-structure updates, and bounded convergence still need implementation evidence.
  - WebGPU VSM page execution, GI sample production, and adaptive shading reconstruction have not been validated.
  - Full VT has no qualified complete donor yet; existing texture mip residency must not be relabeled as VT.
  - Candidate source review is not an implemented or runtime-validated port; third-party notices must follow selected code.
links:
