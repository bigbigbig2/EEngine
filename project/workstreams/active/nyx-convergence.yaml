schemaVersion: 2
id: nyx-convergence
title: Web and Offline Product convergence
domain: virtual-assets
state: active
owner: virtual-assets
decision: ADR-0016
goal: Preserve Nyx geometry stages and invariants across Web cooker, Offline cooker, and the shared GPU traversal and raster consumer.

currentSlice:
  id: browser-consumer-evidence
  title: Prove producer-neutral Product admission reaches the production GPU consumer
  status: active
nextTasks:
  - Capture clean browser consumer evidence on a fixed large-scene workload.
  - Complete source, compiled artifact, and browser audits for remaining legacy owners.
  - Close cross-session memory accounting and failure-atomic replacement.
  - Keep Product admission and GPU consumer evidence at the retained Scene/Visibility seam; re-prove it after the ADR-0020 cut without strengthening legacy Renderer or Sparse Shading ownership.

contracts:
  - geometry-product-v1
  - virtual-geometry-runtime-v1
  - web-geometry-cooker-abi-v1
  - web-cook-session-protocol-v1
claims:
  - virtual-assets.product-consumer
  - virtual-assets.web-cook
  - virtual-assets.lifecycle
completedMilestones:
  - id: source-function-map
    result: Nyx source functions, shader entries, decisions, dependencies, invariants, differences, fallbacks, and validation routes are mapped.
  - id: producer-neutral-product
    result: Web and Offline producers publish the shared Product contract without a producer-specific renderer route.

tasks:
  - id: browser-consumer-evidence
    state: active
    title: Capture clean producer-neutral admission and downstream GPU consumer evidence
    dependsOn: []
    exitCriteria:
      - Fixed browser evidence identifies producer, Product revision, admission, GPU consumer, and disposal.
      - Differential and negative corpora cover topology, bounds, pages, identity, and failure paths.
exitChecks:
  - registry
  - evidence-provenance
requiredEvidence:
  - Source-function and shader-entry mapping for each migrated Nyx stage.
  - Differential and negative corpus for Product topology, bounds, pages, identity, and failure paths.
  - Clean browser evidence for producer-neutral admission and downstream GPU consumption.
  - Source, WASM, output, resident, and transient budgets under a fixed workload.
openGates:
  - Evidence gathered through the old Renderer consumer does not transfer to the new Scene/Visibility seam after the clean cut.
  - Large-scene visible-first cook and first meaningful frame evidence are incomplete.
  - Cross-session source, canonical, and WASM peak accounting is incomplete.
  - Failure-atomic replacement and bounded global residency need accepted evidence.
  - Source, compiled artifact, and browser audits still have legacy owners to close.

links:
  decision: docs/adr/0016-virtualized-assets.md
  sourceLedger: docs/porting/geometry.md
