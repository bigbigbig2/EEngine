      wasmArtifact: checked-in-portable-builder-executed
      engineTests: 451/451
      note: Metadata-scale contract/oracle evidence, not RuntimeValidated or formal PERF. Single oversized primitives remain Phase C; bounded EXT_meshopt decode remains an open Zorah gate.
    exitCriteria:
      - The 100M canonical peak stays within the configured owner budget.
      - Increasing the workload from 100M to 250M does not proportionally increase the live canonical payload peak.
      - No Worker session retains whole-scene decoded geometry.
  - id: giant-primitive-spatial-sharding
