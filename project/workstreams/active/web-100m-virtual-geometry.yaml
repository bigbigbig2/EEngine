  - id: scale-validation-250m-1b
    phase: M
    priority: P2
    title: Validate 250M, 500M, and 1B logical scale without another architecture rewrite
    state: todo
    dependsOn: [formal-100m-perf-freeze]
    exitCriteria:
      - 250M passes the promoted scalability gate.
      - 500M and 1B logical runs show working-set decoupling and identify any cache or scheduler pressure.
      - Tuning changes cache, thrash, scheduler, residency, or prediction policy rather than restoring scene-scale payload residency.
exitChecks:
  - model
  - registry
  - changed-coverage
  - evidence-provenance
  - engine-suites
requiredEvidence:
  - Nyx source-function, shader-entry, decision-condition, data-dependency, invariant, difference, fallback, and validation mapping for every changed geometry stage
  - Fixed workload identities for 10M development, 100M formal, 250M scalability, 500M diagnostic, and 1B logical-scale runs
  - Single-giant-primitive, many-primitives, city-grid, dense-indoor, high-occlusion, camera-cut, and high-instancing coverage
  - Owner-attributed current, peak, and limit bytes for source, canonical, WASM cook, serialized groups, spill, metadata, decoded pages, GPU geometry, and textures
  - Contract and oracle evidence for shard boundaries, seams, hierarchy, Product/Page identity, generation, exact spill re-read, determinism, failure atomicity, and release
  - Clean independent-browser evidence that visible Product shards reach the production GPU consumer before total cook completion
  - Formal 100M PERF evidence with frozen revision, browser, adapter, display, camera, feature, and workload identities
retirementTargets:
  - Full-scene canonical ArrayBuffer ownership in the Web runtime cook path
  - Full-Product retainedGroups lifetime used only to materialize future pages
  - Single-Product Scene identity assumptions in production GPU metadata and instance references
  - Fixed read concurrency and in-flight byte policy used as the only large-scene scheduler mode
openGates:
  - The official Zorah target requires bounded EXT_meshopt_compression decode before its catalog can reach canonical cook.
  - Giant-primitive spatial sharding lacks seam, determinism, and Nyx differential evidence.
  - Multi-Product Scene, relocated GPU Product Table, per-instance identity, streaming routing, and production renderer consumer are implemented; clean 100M browser evidence is still open.
  - Visible-first implementation and GPU demand compaction contract are complete; clean 100M browser duplicate/readback evidence and formal workload execution remain open.
  - GPU demand compaction and adaptive scheduler queues lack promoted capacity and overflow evidence.
  - Portable, Balanced, and HighEnd residency profiles lack negotiated-limit evidence across supported adapters.
  - Formal 100M PERF evidence has not been captured on a clean revision.
  - 250M, 500M, and 1B logical-scale working-set evidence does not exist.
