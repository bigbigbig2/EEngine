requiredEvidence:
  - Authored-large K0 browser evidence with full 1920-primitive catalog coverage, actual Product count, first Product, total cook, Product task/phase trace, owner and spill peaks, settled, and disposal receipts
  - Product Work Planner contract and oracle evidence for canonical bytes, triangles, vertices, and domains on both spatial and ordinary batching paths
  - Separate maxDecodedProductBytes and maxSessionSpillBytes configuration, peak, limit, cleanup, and overflow evidence
  - Nyx source-function, shader-entry, decision-condition, data-dependency, invariant, difference, fallback, and validation mapping for every changed geometry stage
  - Fixed authored cook, authored runtime, authored formal PERF, deferred 100M, and later 250M/500M/1B workload identities
  - Single-giant-primitive, many-primitives, city-grid, dense-indoor, high-occlusion, camera-cut, and high-instancing coverage
  - Owner-attributed current, peak, and limit bytes for source, canonical, WASM cook, serialized groups, spill, metadata, decoded pages, GPU geometry, and textures
  - Contract and oracle evidence for shard boundaries, seams, hierarchy, Product/Page identity, generation, exact spill re-read, determinism, failure atomicity, and release
  - Clean independent-browser evidence that visible Product shards reach the production GPU consumer before total cook completion
  - Formal authored-large PERF evidence with frozen revision, browser, adapter, display, camera, feature, source, and workload identities
  - Deferred formal 100M scale evidence only after the authored target is accepted
retirementTargets:
  - Full-scene canonical ArrayBuffer ownership in the Web runtime cook path
  - Full-Product retainedGroups lifetime used only to materialize future pages
  - Single-Product Scene identity assumptions in production GPU metadata and instance references
  - Fixed read concurrency and in-flight byte policy used as the only large-scene scheduler mode
openGates:
  - K0 authored-large cook reached bounded product-31 but failed because ordinary windows share a provisional Product identity and OPFS returned a different Product page under the colliding key; no accepted browser receipt exists.
  - Progressive producer failure after earlier Products is currently reported as recoverable cook-complete while full-catalog settled remains unreachable; terminal semantics must distinguish partial completion from a successfully settled session.
  - K1 activation-first publication, planner scratch/materialization, incremental Scene publication, automatic Product capacity, runtime smoke, and source/decode/upload telemetry remain open.
  - The official Zorah target requires bounded EXT_meshopt_compression decode before its catalog can reach canonical cook.
  - Giant-primitive spatial sharding lacks seam, determinism, and Nyx differential evidence.
  - Multi-Product Scene, relocated GPU Product Table, per-instance identity, streaming routing, and production renderer consumer are implemented; clean authored browser evidence is still open.
  - Visible-first implementation and GPU demand compaction contract are complete; clean authored browser duplicate/readback evidence and formal workload execution remain open.
  - GPU demand compaction and adaptive scheduler queues lack promoted capacity and overflow evidence.
  - Portable, Balanced, and HighEnd residency profiles lack negotiated-limit evidence across supported adapters.
