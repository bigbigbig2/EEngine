      note: Contract/oracle evidence, not 100M browser RuntimeValidated or formal PERF. Phase D retainedGroups/cook-and-spill and bounded EXT_meshopt decode remain open.
    exitCriteria:
      - A single 100M-triangle primitive produces more than one bounded shard.
      - Bounds, seams, attributes, materials, hierarchy, and ownership remain valid.
      - Identical input and recipe produce stable shard and Product identities.
  - id: cook-and-spill
