      - WASM and serialized-group peaks remain within declared budgets for the 100M workload.
      - Completed Group payloads are not retained solely for future page reads.
      - OPFS page re-read is byte-exact and decoded identity plus payload checksum remain stable.
      - Cancellation, failure, retry, and release do not publish partial or mixed-generation Products.
  - id: multi-product-runtime
    phase: E
    priority: P0
    title: Admit and render independently owned Product shards through one Product Table
    state: done
    dependsOn: [cook-and-spill]
    completedEvidence:
      review: docs/reviews/2026-09-22-web-100m-phase-e-multi-product-runtime.md
      contract: docs/specs/web-geometry-multi-product-runtime-v1.md
      implementationStatus: production-consumer-and-oracle-complete
      slotCapacity: 128
      activeShardEvidence: 64
      productTableRecordStrideBytes: 64
      instanceAbiVersion: 8
      instanceRecordStrideBytes: 176
      contractTest: OEngine/tests/contract/geometry-product-multi-runtime.test.mjs
      testResult: relocation-instance-demand-streaming-scene-merge-covered
      note: Production consumer is wired; clean 100M browser RuntimeValidated, TTFMF, and formal PERF evidence remain Phase K gates.
    exitCriteria:
      - At least 64 Product shards can be active concurrently in the production renderer.
      - Each shard supports independent load, replacement, eviction, dormancy, and release.
      - Product-local PageID and generation reject stale demand and stale page completion.
      - GPU Product Table and instance identity ABI have an authoritative spec and contract/oracle coverage.
