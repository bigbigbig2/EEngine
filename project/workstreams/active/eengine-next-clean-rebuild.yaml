goal: >-
  Follow the user-selected V3 SurfaceWork Runtime design: implicit/uniform/mixed work,
  one SurfaceGeometryRecord producer, early Appearance cache lookup and miss-only
  evaluation, independent lighting signal packets, authoritative TemporalFacts and
  cheap reconstruction on one production FrameGraph and frame submit.

