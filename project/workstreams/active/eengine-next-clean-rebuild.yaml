schemaVersion: 2
id: eengine-next-clean-rebuild
title: EEngine Next single-path clean-cut renderer rebuild
domain: frame-runtime
state: active
owner: frame-runtime
decision: ADR-0020
goal: Delete the old Surface production path first, continuously rebuild the complete cached Surface architecture with shared geometry, compiled Appearance, independent sparse lighting and reconstruction, then validate quality and net performance only after the final path is implemented.

currentSlice:
  id: surface-cached-shading-direct-rebuild
  title: Surface 最终主链直接重建：先删旧链，完整实现后统一验收
  status: active
  goal: 剩余内容按三个大步骤推进；当前执行第一步，删除旧Surface生产链并完成共享几何/稳定地址、实时材质/coverage及Appearance需求/缓存/消费完整数据体系；第二步一次完成分信号稀疏照明、历史重建、真实provider、HDR/Temporal/Presentation与全链生命周期清理；第三步才统一编译、数值、生命周期、本地Chrome、连续画质与两coverage性能验收和新链返工。前两步连续编码，不将算法或owner再拆成独立推进/闭合步骤，允许中间未编译/无完整画面，不保留旧consumer或临时桥。已有材质产品/共享几何基础可复用，旧Surface仍待实际删除，最终性能未通过。

