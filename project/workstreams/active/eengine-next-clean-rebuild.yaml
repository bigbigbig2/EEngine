architectureRules:
  - Keep one production Renderer path and one frame submit owner.
  - Delete the old Surface scheduler, sample ABI/results, Resolve and full-screen closure-lighting before building the final consumer; never reconnect them for intermediate tests or output.
  - Allow incomplete intermediate code and output; do not introduce compatibility bridges, placeholder effects or per-component closure gates.
  - During this Surface rebuild, defer all compilation and test runs until the complete target code and production wiring are implemented, unless the user explicitly requests a diagnostic.
  - Do not restore retired EnvironmentBackgroundPass, DirectionalLight world-sun ownership, CSM, old SSR/GTAO/SSGI/TAA, or a Legacy/Next dual path.
  - Do not introduce current-frame GPU-to-CPU-to-GPU visible/work control.
  - Pinned complex algorithms must preserve source stages, branches, dependencies and invariants; approximate implementations cannot claim upstream completion.
  - WebGPU capabilities and limits are negotiated before resource creation.

deferredValidation:
  policy: For the current Surface rebuild, run compilation and validation only after the entire cached Surface, sparse lighting and reconstruction target is implemented on the single new production path; no intermediate module closure checks.
  finalAcceptance:
    - typecheck
    - build
    - final shader compilation, CPU/WGSL numerical oracles and complete coverage/ownership checks
    - browser matrix and lifecycle cases
    - scene/material/feature interaction coverage
    - static images and continuous motion/disocclusion visual quality comparison
    - real local Chrome GPU benchmarks at 25-35% and 80-90% visible coverage
    - Surface all-cost P50/P95 reduction of at least 50% and GPU pass-sum P50/P95 reduction of at least 30%
    - formal evidence and claim promotion

