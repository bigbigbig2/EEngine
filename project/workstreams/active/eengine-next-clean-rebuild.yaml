schemaVersion: 2
id: eengine-next-clean-rebuild
title: EEngine feature expansion / Native renderer foundations
domain: frame-runtime
state: active
owner: frame-runtime
# Foundational single-path ownership decision only; renderer direction is authority below.
decision: ADR-0020
authority:
  design: docs/next-design/eengine-feature-expansion-roadmap-2026-10.md
  execution: docs/next-execution/eengine-feature-expansion-execution-2026-10.md
goal: >-
  Build an extreme-performance GPU-driven WebGPU-native AAA renderer for
  GTX 1650 Ti 4GB at 1080p and scalable newer GPUs. Follow global V4 invariants
  and the current module authority through complete producer/product/direct-consumer
  cutovers. Preserve completed foundations and design later modules from actual inputs.
  Follow the user's feature-first direction: complete useful rendering capabilities
  before concentrated whole-renderer performance optimization. Keep correctness,
  bounded resources, real GPU wiring and lifecycle checks within each module.
  Record the actual validation device for each run;
  historical measurements retain their original device and thermal-state identity.

currentSlice:
  id: feature-expansion-planning
  title: Source-backed feature roadmap and module design entry
  status: closed
  goal: >-
    The user authorized careful source analysis and adjustment of the documentation
    direction and coarse plan. Preserve the working Native/VG/Lighting/Texture/Temporal
    foundations and plan AO functionality, VT, reflection, indirect lighting,
    transparency/media and reconstruction policy from actual production consumers.
    Documentation delivery is closed; this slice implements none of those effects.
    Stop before the AO detailed-design/implementation unit. Design one detailed module from
    current source when that module is started; do not prefreeze all algorithms.
    Unit states live only in the execution authority. V5 formal performance
    qualification is deferred, not passed and not a prerequisite for new effects.

pausedModules:
  - id: final-pixel-performance-v5
    design: docs/next-design/eengine-v5-final-pixel-performance-2026-10.md
    execution: docs/next-execution/eengine-v5-final-pixel-performance-execution-2026-10.md
    reason: User chose feature expansion first; keep implemented cutovers and original failures, defer formal qualification and conditional receiver optimization.
  - id: minimal-gpu-work-v4
    design: docs/next-design/eengine-v4-minimal-gpu-work-2026-10.md
    execution: docs/next-execution/eengine-v4-minimal-gpu-work-execution-2026-10.md
    reason: Keep the user's pause and implemented A-F results; feature expansion does not resume the old optimization sequence.
  - id: vsm-v4
    design: docs/next-design/eengine-v4-vsm-2026-10.md
    execution: docs/next-execution/eengine-v4-vsm-execution-2026-10.md
    reason: Preserve the implemented directional shadow chain and unresolved R4 qualification; new effect correctness involving VSM remains the responsibility of its current unit.

nextModules:
  - id: ao-functionality
    title: Existing XeGTAO settings, scene scale, quality and observability
  - id: virtual-resources-v4
    title: Virtual Texture / compressed page products, residency, sampling and streaming
  - id: reflection
    title: Reflection with current Native inputs and correct IBL composition
  - id: indirect-v4
    title: First complete indirect-lighting capability
  - id: transparency-media-v4
    title: Transparency and participating media
  - id: temporal-v4
    title: Reconstruction and presentation policy on existing Native and FSR owners
  - id: integrated-performance
    title: Feature combinations and concentrated whole-renderer optimization

navigationRules:
  - Global architecture invariants live in the V4 mother document; general validation rules live in docs/VALIDATION.md.
  - This file routes modules only; unit states and deferred validation responsibilities live in the execution authority.
  - Paused modules are historical references, never additional current authorities or automatic resume instructions.
  - Future module algorithms are designed from current source and mature references when that module starts.

deferredValidation:
  legacyRetiringPathDefects:
    - id: B2-NUM-001
      status: legacy-retiring-path-known-defect
      record: docs/next-execution/eengine-extreme-performance-rebuild-execution-2026-10.md#22-未关闭正确性问题与用户例外
      disposition: Unfixed and unresolved; not a V4 legacy-repair blocker. Retire only when the offending old producers are removed; migrate update, abort/retry and numeric semantics to V4 owners.
    - id: B2-NUM-002
      status: legacy-retiring-path-known-defect
      record: docs/next-execution/eengine-extreme-performance-rebuild-execution-2026-10.md#22-未关闭正确性问题与用户例外
      disposition: Unfixed and unresolved; not a V4 legacy-repair blocker. Retire only when the offending old producers are removed; migrate publication atomicity and stable HDR semantics to V4 owners.
  policy: >-
    Development uses light targeted checks. Closed units receive concentrated
    correctness, wiring, lifecycle and cost validation as defined by the execution plan.
    Each module receives its own required acceptance; formal whole-renderer browser,
    quality, performance evidence and claims wait for final integration.
    Missing required results keep the corresponding unit incomplete.
