schemaVersion: 2
id: eengine-next-clean-rebuild
title: EEngine Next single-path clean-cut renderer rebuild
domain: frame-runtime
state: active
owner: frame-runtime
decision: ADR-0021
goal: >-
  Rebuild the execution and data model so frame cost is set by the scale of the execution
  structure rather than by scene complexity or pixel count: few bounded execution scopes,
  an explicit domain entity that replaces per-pixel reuse proof, cost-classified reuse that
  must earn its place, one authority per data product, and one production FrameGraph with
  one frame submit.

currentSlice:
  id: eengine-extreme-performance-rebuild
  title: 极致性能重建：A0 测量口径 → A1 FrameGraph → B1 域实体竖切
  status: active
  goal: >-
    按 docs/next-design/eengine-extreme-performance-rebuild-2026-10.md（母稿）
    与 docs/next-execution/eengine-extreme-performance-rebuild-execution-2026-10.md 推进。
    母稿取代此前的 V3 原文、有界前端设计与优化 V1 设计，三者已归档至 docs/archive/。
    基线快照 09449d6d；重构前性能基线为近景 Surface GPU P50 785.19 ms，管理成本 708.71 ms
    对实际计算 23.26 ms（约 30:1），整帧 2,689 个 graph node。
    本次按切换单元推进：A0 测量口径与基线 → A1 FrameGraph 执行器 → B1 域实体竖切（可行性门）
    → B2 域/率全面替换 → C 材质分类与信号复用 → D Geometry 完整工作域 → E Lighting/Shadow
    极端路径 → F Temporal/Post 收口。
    三条架构不变量每个单元必过：命令数与场景复杂度解耦、管理成本不超过实际计算成本、
    复用层关闭后仍正确且同量级。
    A 与 B 并行推进，但 B 先以 B1 竖切验证可行性——A 只治 CPU graph 执行（近景约 40 ms，
    占 Surface 785 ms 的约 5%），先做安全的 A 会掩盖真正的手术。
    不承诺固定 FPS 或百分比；正式历史性能比较留最终验收。

