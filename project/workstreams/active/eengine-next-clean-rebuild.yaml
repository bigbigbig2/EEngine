architectureRules:
  - The user-selected V3 design is the sole Surface target; keep one production Renderer path and one frame submit owner.
  - Keep GPU Scene, Visibility, resource owners and correct math; do not restore retired Surface or effect owners.
  - Use implicit, uniform and mixed tile work; do not generate a pixel task for every full-rate pixel.
  - SurfaceGeometryRecord has one producer; Appearance and Lighting do not reconstruct geometry independently.
  - Cache lookup precedes material miss compaction; hits bypass geometry and material heavy workers.
  - Keep constant/static, stable-local cache and dynamic/view/nonlocal signal work distinct; compare complete cache identities.
  - Diffuse, specular, coat and IBL have independent work and local full-rate exceptions.
  - TemporalFacts is the sole motion, identity, validity and reactive base producer.
  - Reconstruction selects packet/history results and composes them; it does not execute full geometry, material or PBR again.
  - Expose actual work, geometry, cache, packet, history and HDR dependencies in FrameGraph.
  - Negotiate WebGPU limits before resource creation; every queue declares capacity, overflow, coverage and retirement.
  - Delete replaced execution models without compatibility bridges or placeholder effects; incomplete intermediate code is allowed.
  - Do not introduce current-frame GPU-to-CPU-to-GPU visible/work control, private submits or one universal physical queue.
  - Cache pipelines, bind groups and samplers by publication/profile; do not create a PSO for each material instance or texture combination.
  - Follow the latest user instruction: finish and check each full optimization Phase, make one Chinese commit, then proceed; frame-wide browser/quality/performance acceptance remains in Phase 7.
  - Pinned complex algorithms preserve source stages, branches and invariants; documentation alignment does not promote adoption or claims.

deferredValidation:
  policy: >-
    Follow the user-selected optimization-v1 design and execution plan.
    Phase 0 freezes identities, capacity and deletion inventory; each subsequent Phase is fully implemented,
    checked and committed once before the next Phase. Stage checks do not prove frame-wide completion.
    Phase 7 performs unified quality, lifecycle, GPU acceptance and fixed-condition comparison in independent checkouts.
  finalAcceptance:
    - typecheck and build after the complete target and production wiring
    - shader compilation, CPU/WGSL numerical oracles, complete coverage and write ownership
    - browser and resize, camera cut, abort, device recovery and resource retirement
    - far/near, static/moving, high-frequency normal/ORM, multi-material and strong IBL quality
    - direct plus VSM, AO on/off, Product LOD/page miss, empty and single Product cases
    - same-condition comparison of 89f0a94, 15f12f7b, e7296be9 and the pinned final revision
    - GTX 1650 Ti 1080p complex scenes with fixed camera, features, browser, warm-up and thermal state
    - all-cost Surface and GPU frame P50/P95 with hit/miss, geometry, signal, exception, IBL, overflow and memory counters
    - V3 section 8.3 success criteria and all 16 section 11 completion items; no promised FPS or fixed percentage
    - formal evidence and claim promotion only for actually validated scope

