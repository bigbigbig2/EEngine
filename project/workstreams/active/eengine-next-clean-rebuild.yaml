goal: >-
  Preserve the user-selected V3 architecture while implementing the cost-bounded Surface frontend:
  independent candidate/value/certificate contracts, fixed spatial hierarchy, profitable cache/proof
  admission, one hot/cold GeometryRecord producer, actual missing closures and independent signals,
  bounded memory and complete coverage on one production FrameGraph and frame submit.

