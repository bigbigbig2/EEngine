# Foundational single-path ownership decision only; renderer direction is authority below.
decision: ADR-0020
authority:
  design: docs/next-design/eengine-v5-final-pixel-performance-2026-10.md
  execution: docs/next-execution/eengine-v5-final-pixel-performance-execution-2026-10.md
goal: >-
  Build an extreme-performance GPU-driven WebGPU-native AAA renderer for
  GTX 1650 Ti 4GB at 1080p and scalable newer GPUs. Follow global V4 invariants
  and the current module authority through complete producer/product/direct-consumer
  cutovers. Preserve completed foundations and design later modules from actual inputs.
  Prioritize same-quality final-pixel performance and bounded resource ownership
  before adding advanced effects. Record the actual validation device for each run;
  historical measurements retain their original device and thermal-state identity.

currentSlice:
  id: final-pixel-performance-v5
  title: Final Pixel architecture freeze and complete execution cutovers
  status: active
  goal: >-
    Freeze the source-backed Final Pixel target and execution contracts for
    logical VSM ownership with physical Native Sun fusion, Native Temporal Seed,
    and a native-resolution previous-depth-pull Temporal graph. The user authorized
    committing the authority and starting Phase 1's nonproduction replacement closure.
    Keep Geometry frontend fixed, preserve historical evidence,
    and complete each architecture unit before concentrated validation. Unit states
    live only in the execution authority; advanced effects remain deferred.

