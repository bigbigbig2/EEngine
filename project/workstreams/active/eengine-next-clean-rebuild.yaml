goal: >-
  Rebuild Surface V3 first for GTX 1650 Ti at 1080p: few bounded execution scopes,
  explicit publication domains, complete direct evaluation, cost-classified reuse,
  thin Geometry products and finite material families. Command topology is independent
  of pixel, tile and material-instance counts; actual GPU work follows complete demand.
  Keep one authority per product, one production FrameGraph and one frame submit.

currentSlice:
  id: eengine-extreme-performance-rebuild
  title: Surface V3 集中重建：必要测量与执行底座 → 域竖切 → 完整生产链替换
  status: active
  goal: >-
    按现有母稿与执行文档的 Surface 集中重建细化方案推进；本次仅更新设计和计划，未实施新链。
    保持 A0 → A1 → B1 → B2 → C → D → E → F 的切换单元顺序。
    A0/A1 只前移必要测量、lifetime events 和物理资源身份；B1/B2/C 是首要生产路径替换。
    B1 验证廉价 closure 真实消费、有限 family 的完整 DAG 可行性和无复用完整输出；
    B2 切换需求、Record、全部直接 consumer、reset/capacity，C 落实有净收益的字段与信号复用。
    命令有界、管理成本和复用可关闭逐单元核对，明确单元范围与尚未收口的整帧遗留，
    不以局部通过宣称全架构已通过。必要 Geometry/Lighting/Temporal 接线随 producer 前移。
    独立 GPU 审计基线 09449d6d 是历史定位；分项 P50 合计不是逐帧比例，
    CPU graph 时间不能从 GPU Surface 时间相减。新性能、质量及采用均待实际实施验证。
    未来 providers 只保留明确产品扩展合同，不先建设无消费者基础设施，不承诺固定 FPS。

