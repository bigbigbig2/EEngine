schemaVersion: 2
id: eengine-next-clean-rebuild
title: EEngine Renderer Feature Completion
domain: frame-runtime
state: active
owner: frame-runtime
# Foundational single-path ownership decision only; renderer direction is authority below.
decision: ADR-0020
roadmap:
  design: docs/next-design/eengine-feature-expansion-roadmap-2026-10.md
  execution: docs/next-execution/eengine-feature-expansion-execution-2026-10.md
# Only the selected module pair is the current authority; roadmap remains stable.
authority:
  design: docs/next-design/eengine-extreme-web-asset-compression-2026-10.md
  execution: docs/next-execution/eengine-extreme-web-asset-compression-execution-2026-10.md
goal: >-
  Build an extreme-performance GPU-driven WebGPU-native AAA renderer for
  scalable GPUs, including measured low-memory profiles without a 4GB large-scene guarantee. Follow global V4 invariants
  and the current module authority through complete producer/product/direct-consumer
  cutovers. Preserve completed foundations and design later modules from actual inputs.
  Follow the user's feature-first direction: complete useful rendering capabilities
  before concentrated whole-renderer performance optimization. Keep correctness,
  bounded resources, real GPU wiring and lifecycle checks within each module.
  Record the actual validation device for each run;
  historical measurements retain their original device and thermal-state identity.

currentSlice:
  id: extreme-web-asset-compression
  title: Port-first extreme Web asset compression
  status: in-progress
  goal: >-
    Follow the user's replacement-design authorization for port-first image
    delivery and runtime GPU encoding across the complete LDR PBR texture set.
    Cover ordinary textures, virtual textures and source-exact compact geometry;
    use the authority pair for architecture and detailed execution state.
    Implement each complete closure and cut over every direct consumer in the
    same unit; immediately delete replaced contracts and dedicated dependencies.
    Temporary intermediate breakage is allowed, without legacy bridges or fallbacks.
    The user has authorized E2, the complete atomic texture-chain cutover,
    including ordinary/virtual consumers, loading/deployment code and retirement.
    Follow the user's revised cadence: E0-E4 use design/source review and only
    minimal relevant correctness checks. Do not retain legacy compatibility to
    keep intermediate examples runnable. Full asset cook/recook, deployment and
    full-path integration tests belong only to the final E5 unit.
    Detailed unit results live in the execution authority. E3 onward requires
    separate implementation authorization.
    Do not start other renderer modules.

