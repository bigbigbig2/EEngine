schemaVersion: 2
id: eengine-next-clean-rebuild
title: EEngine Next single-path clean-cut renderer rebuild
domain: frame-runtime
state: active
owner: frame-runtime
decision: ADR-0020
goal: Establish the final architecture's Frame Program, Surface and Temporal boundaries on the single production path, then integrate planned providers in large continuous modules.

currentSlice:
  id: surface-sample-driven-shading-phase-four
  title: Surface 分频着色阶段四：模块清理、验证与交接
  status: completed
  goal: 阶段四已完成旧 owner/陈旧合同清理、生命周期边界复核与模块级集中验证；正式浏览器、画质、整帧性能与 claims 验收仍后置。
  completed: |
    Surface 阶段一：recipe surface-v5/32-byte primitive domain-risk-variation metadata、资产内唯一域 ID、完整 page/group 容量切分、材质 ABI v7/64-byte role routes、TextureResidency 实际版本/区间发布、8x8 workgroup SurfaceProbe/CPU reference/counters 和独立 Temporal rigid motion 已接入唯一生产路径。阶段二已替换旧 frequency/Dense/seven-lane ABI：四个 resident-set profiles、同率 descriptor/mixed compact、record/result 整 tile 提交、独立 finalize、不可变 sample results 与 Resolve 接入唯一生产 FrameGraph。阶段三已接入 Signal-Rate Cell Layout、packed Probe rates、effective coverage、Resolve key/depth/result 边界和 signal counters。阶段四已清理旧 owner/陈旧合同断言，复核 resize/camera cut/scene-product/device epoch 生命周期，并完成模块级集中验证。默认预算严格；受控真实非恒定纹理 PBR/方向光由64降至16 material/lighting samples；未知 punctual/阴影/天空/ORM/normal-map/Coated 全率。
    阶段二 typecheck/build、31 项 targeted Node checks 与 Dawn D3D12 生产 FrameGraph GPU oracle 通过；记录 full/方向率/quad/mixed、全池及 partial overflow、背景/非法 key/Coated/灯表/驻留变化/移动相机与独立 motion。阶段三新增 Signal-Rate Cell Layout：lighting/material/emissive/normal 四个方向率共享一个 u32，Probe/Builder/worker/Resolve 共用 effective coverage；normal/ORM/Coated/未知 closure 按信号回退 full，Resolve 增加 key/depth/result 边界和 CPU owner/neighbor oracle，新增 material/lighting coarse counters。阶段三 typecheck/build:test 与定向 signal/sample/投影检查通过；正式 browser/画质/lifecycle/性能与 claims 未运行。GPU shader 诊断关闭驱动优化，不作为性能测量；本次未改 Cooker/Product，不重复重建 Native/WASM。阶段一已有131项/Native/WASM验证记录保留。额外检查中的两处既有陈旧合同断言见 Surface 执行文档，不宣称全量测试全通过。
    历史 VG/VSM 记录保留其验收边界：VG 曾修复 object-space bounds、meshlet handoff、保守 HZB 和 Float32 位置/terminal error，并有相应定向测试；此前近景 barrel/wedge 与 UV/tangent 质量问题未完成验收，不能因本次 metadata 或既有 attribute-update cooker 源码而视为关闭。Previous-HZB early rejection 的 recovery 仍待接通。VSM E0-E9 的既有页需求/分配/caster/Atlas/Surface 集成及 Perf Host 测量记录不证明本次 Surface 或 VG 性能。

nextModules:
  - id: sssr
    title: FidelityFX SSSR production provider
  - id: hybrid-gi
    title: Screen, world-space and sky GI production providers
  - id: virtual-resource
    title: Virtual resource control-plane convergence and VT
  - id: transparency-media
    title: Transparency, local media and presentation integration

architectureRules:
  - Keep one production Renderer path and one frame submit owner.
  - Do not restore retired EnvironmentBackgroundPass, DirectionalLight world-sun ownership, CSM, old SSR/GTAO/SSGI/TAA, or a Legacy/Next dual path.
  - Do not introduce current-frame GPU-to-CPU-to-GPU visible/work control.
  - Pinned complex algorithms must preserve source stages, branches, dependencies and invariants; approximate implementations cannot claim upstream completion.
  - WebGPU capabilities and limits are negotiated before resource creation.

deferredValidation:
  policy: Deferred until the current large module or the whole Next Renderer is coherent.
  moduleClose:
    - typecheck
    - build
    - focused targeted tests for the completed module
  finalAcceptance:
    - browser matrix and lifecycle cases
    - scene/material/feature interaction coverage
    - visual quality comparison
    - GPU performance benchmark with P50/P95
    - formal evidence and claim promotion

