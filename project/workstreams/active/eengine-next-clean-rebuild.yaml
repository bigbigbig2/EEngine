architectureRules:
  - Command topology is bounded by execution and resource families, not pixels, tiles, authored graph count or material instances. Actual evaluation cost may grow with complete demand.
  - Management cost must not exceed the cost of the computation it manages. This is invariant B and it is checked, not asserted.
  - The whole reuse layer must be switchable off with the frame still correct and still in the same order of magnitude. This is invariant C.
  - A publication domain is a shared identity and address entity; it may contain many samples and tile references. Common identity proof is published once; signal-specific quality and validity remain explicit.
  - Recommended reuse strategy is decided at publication time, never by a per-tile dynamic cost predictor.
  - Not every product must be sparse. High-frequency regions legitimately keep geometry near full rate; forcing sparsity everywhere is an incorrect target.
  - One authority per data product. Consumers get an explicit read interface; no second geometry recovery owner, no consumer-side writes into a shared record.
  - Replacing a producer and all of its direct consumers is one atomic switch. No adapters, no placeholder effects, no empty consumers, no second production path.
  - Required full-rate coverage, depth, motion and identity are independent of reuse admission. Bounds, background, invalid input and demanded field branches retain their correctness roles.
  - Unique GeometryRecord means one production semantics and one demand union, not every primary storing every field. Thin records plus on-demand completion are allowed; a fixed write domain per field is not.
  - Whole-algorithm sources: read pinned complete upstream implementations before complex work, and keep design, implementation and validated adoption as separate states.
  - ProgramTemplate, MaterialSnapshot and ExportPlan are separate. Complete unmatched legal graphs use the same General VM; templates are data rather than per-graph GPU command topology.
  - Typed appearance execution separates semantic width from C/X/Y point domains. Scratch is accounted in live f32 words and complete uniform dependency updates preserve GPU math and publication transactions.
  - Geometry completion feeds Appearance locally through the unique Geometry owner. Arena-backed prepared attributes and exact resident fallback share one source protocol across Coverage and Surface readers.
  - Signals retain six independent RGB f32 semantics with explicit validity, rate, transport and version state; consumers preserve original guards and radiometric composition.
  - Delete rather than adapt: retired owners, no-consumer dependencies and duplicate authority are removed, not bridged.
  - Real compile failures must be fixed. Weakened assertions, widened tolerances, disabled features and test-only production fallbacks are not ways to pass a unit.
  - Stage state is maintained only in this workstream's currentSlice and the execution plan. Entry documents must not copy it.
  - Appearance work domains, actual heavy evaluations and value reads are distinct from coverage, template bins and Lighting rates.
  - Complete producer-to-consumer cutover units before concentrated checks; defer representation micro-tuning until the core architecture is connected.

