schemaVersion: 2
id: eengine-next-clean-rebuild
title: EEngine Renderer Feature Completion
domain: frame-runtime
state: active
owner: frame-runtime
# Foundational single-path ownership decision only; renderer direction is authority below.
decision: ADR-0020
roadmap:
  design: docs/next-design/eengine-feature-expansion-roadmap-2026-10.md
  execution: docs/next-execution/eengine-feature-expansion-execution-2026-10.md
# Only the selected module pair is the current authority; roadmap remains stable.
authority:
  design: docs/next-design/eengine-vsm-quality-2026-10.md
  execution: docs/next-execution/eengine-vsm-quality-execution-2026-10.md
goal: >-
  Build an extreme-performance GPU-driven WebGPU-native AAA renderer for
  scalable GPUs, including measured low-memory profiles without a 4GB large-scene guarantee. Follow global V4 invariants
  and the current module authority through complete producer/product/direct-consumer
  cutovers. Preserve completed foundations and design later modules from actual inputs.
  Follow the user's feature-first direction: complete useful rendering capabilities
  before concentrated whole-renderer performance optimization. Keep correctness,
  bounded resources, real GPU wiring and lifecycle checks within each module.
  Record the actual validation device for each run;
  historical measurements retain their original device and thermal-state identity.

currentSlice:
  id: vsm-quality-reconstruction
  title: Directional VSM quality and GPU work reconstruction
  status: in-progress
  goal: >-
    Follow the user's 2026-10-23 revised source-led design: three complete closures
    for page/quality resources, shared geometry and page-confined hardware raster
    with precise updates, then stable PCF/complete PCSS and final integration.
    No dual-backend competition or repeated intermediate test campaigns.
    Preserve complete-page correctness and bounded work; final parameter tuning
    is user-led. The user authorized implementation and commit of step 1 only;
    stop before step 2 until further authorization.
    Detailed states and retained old Q1 results live only in execution.

