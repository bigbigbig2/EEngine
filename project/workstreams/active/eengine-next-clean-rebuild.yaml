currentSlice:
  id: surface-work-v3-optimization-v1
  title: Surface V3 第一版优化：连续域跨 primitive 共享与有界缓存和信号
  status: active
  phaseStatus: >-
    第一版优化按用户最新指令逐 Phase 完整实现、检查、每阶段一次中文提交后继续。
    Phase 0 已固定 0676cf28478bc2f4b96af7138f45ef33f1216a3f 与 Dungeon SHA256，建立生产删除/依赖清单、
    capacity policy 和 412 MiB / 512 MiB 预算；5 项定向 capacity tests 通过。
    Phase 1 已完成六域 continuity-v2、源/LOD逐字段lineage、普通Geometry真实metadata upload、Native与两种WASM v6发布，
    offline RGBA8摘要和实际GPU decoded mip/footprint摘要；所有表/节点在32 MiB pool中，接现有TextureResidency encoder。
    typecheck/build、Native/core ABI oracle、两个WASM编译、33项定向checks和5个生产纹理摘要GPU cases通过；
    组件结果不证明整帧画质性能。Phase 2 已完成代码切换：runtime 旧 classifier 源码已删除，多字段 WGSL 生成错误已修复；真实 Chromium producer/consumer fixture 在 pipeline compile 阶段仍未完成，因此不提升为正式整链验收。Phase 3 已开始把 FieldStore request pack、GPU lookup、初始化和 publish 接入材质 lookup；旧 dense keys/values/fields 仍待替换，Phase 4–7 尚未开始。
    以下为 0676cf28 历史基线能力和诊断记录，不是本轮新算法完成证据。
    用户 2026-10-03 明确请求的 Showcase 修复已接入：diffuse irradiance 消费补 1/pi、示例曝光 8→4；
    Surface 队列有序单份 extent 资源、精确 pixel/input witness、逐字段版本 lookup、masked miss evaluation、
    独立 GeometryRecord 命中与 classify/miss 编译期分离、dirty lighting GPU compact/indirect、持久 signal packets。
    静止复用包含精确 GPU camera 输入；Dynamic/Nonlocal 和 VSM direct 保守重算，相机变化使相关字段失效。
    本次已运行 typecheck/build、25 项 targeted tests、30 项 GPU 判定 oracle 和包含移动/resize 返回/太阳编辑的截图；
    测量与限制集中记录于 .local/validation/surface-p0p5-report.md。完整跨视角 footprint cache、Product/形变、
    连续画质误差界与 V3 四版本正式验收仍未完成，不提升来源采用或 claims。
  goal: >-
    按 docs/next-design/surface-work-v3-optimization-v1-design-2026-10.md 与对应执行计划完成连续域、
    字段/信号多率、canonical FieldStore、demand hot/cold GeometryRecord、稀疏 SignalStore 与固定预算 batches。
    每 Phase 完整完成实际 producer/consumer 和必要定向检查后提交一次，失败返工；整帧验收在 Phase 7。
    保留以下原 V3 目标与历史阶段记录，旧物理布局按新计划删除，不建立运行时新旧桥。
    Phase 0 已冻结 GTX 1650 Ti/1080p、Dungeon fingerprint、功能集、覆盖率和 P50/P95 口径，配置见
    validation/profiles/surface-work-v3-phase0-baseline.yaml。Phase 2–6 的最终生产链尚未完成；当前源码中的旧 material cache、dense packet/history 和 reconstruct 仍是事实，
