schemaVersion: 2
id: eengine-next-clean-rebuild
title: EEngine Next single-path clean-cut renderer rebuild
domain: frame-runtime
state: active
owner: frame-runtime
decision: ADR-0020
goal: Establish the final architecture's Frame Program, Surface and Temporal boundaries on the single production path, then integrate planned providers in large continuous modules.

currentSlice:
  id: surface-sample-driven-shading-phase-one
  title: Surface 分频着色阶段一：连续性、材质签名、SurfaceProbe 与独立 motion
  status: completed
  goal: 阶段一已完成真实 textured Standard PBR 候选事实与独立 rigid motion；下一步实施 sample-driven worker/Resolve，不提前宣称重着色减量。
  completed: |
    Surface 阶段一：recipe surface-v5/32-byte primitive domain-risk-variation metadata、资产内唯一域 ID、完整 page/group 容量切分、材质 ABI v7/64-byte role routes、TextureResidency 实际版本/区间发布、8x8 workgroup SurfaceProbe/CPU reference/counters 和独立 Temporal rigid motion 已接入唯一生产路径。PBR 重着色仍全率，默认预算全零，受控非恒定纹理 GPU oracle 能产生跨 primitive quad 候选；阶段二至四未实施。
    typecheck/build、131 项定向 Node checks、Dawn D3D12 生产 shader GPU oracle、Native Cooker/ABI oracle 和两种 WASM 构建通过。正式 browser/画质/lifecycle/性能与 claims 未运行。额外检查中的两处既有陈旧合同断言见 Surface 执行文档，不宣称全量测试全通过。
    历史 VG/VSM 记录保留其验收边界：VG 曾修复 object-space bounds、meshlet handoff、保守 HZB 和 Float32 位置/terminal error，并有相应定向测试；此前近景 barrel/wedge 与 UV/tangent 质量问题未完成验收，不能因本次 metadata 或既有 attribute-update cooker 源码而视为关闭。Previous-HZB early rejection 的 recovery 仍待接通。VSM E0-E9 的既有页需求/分配/caster/Atlas/Surface 集成及 Perf Host 测量记录不证明本次 Surface 或 VG 性能。

