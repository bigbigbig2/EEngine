title: EEngine V4 Native Shading single-path cutover
domain: frame-runtime
state: active
owner: frame-runtime
# Foundational single-path ownership decision only; renderer direction is authority below.
decision: ADR-0020
authority:
  design: docs/next-design/eengine-v4-native-shading-2026-10.md
  execution: docs/next-execution/eengine-v4-native-shading-execution-2026-10.md
goal: >-
  Build an extreme-performance GPU-driven WebGPU-native AAA renderer for
  GTX 1650 Ti 4GB at 1080p and scalable newer GPUs. Follow the V4 authority
  through complete producer/product/direct-consumer cutovers, starting with
  native opaque Surface. Design later modules from their actual implementation inputs.

currentSlice:
  id: surface-v4
  title: Surface V4 — Native Opaque Shading Cutover
  status: complete
  goal: >-
    Surface V4 has reached its S3 acceptance boundary; results and limitations
    live only in the execution authority. Stop at the completed M1 boundary.
    Design M2 from the actual Geometry and Virtual Geometry code before activating it.
    Do not automatically start another large module or restore retired Surface paths.

