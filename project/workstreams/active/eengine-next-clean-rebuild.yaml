architectureRules:
  - One production renderer, one authority per product, one frame submit; no current-frame GPU-to-CPU-to-GPU work control.
  - Visibility is the opaque winner contract, including alpha-tested coverage and complete lifetime context.
  - Material graphs compile to native GPU code; no material interpreter in the normal production hot path.
  - Full-rate native shading is the correctness baseline; command count may follow unique execution bins, never material-instance count proportionally.
  - No global Surface proof/cache/history operating system and no mandatory six-signal intermediate representation.
  - Cross-pass products exist only for actual consumers; effect-specific history and cache belong to that effect.
  - Expensive Surface Facts Once; repeated Visibility-to-Surface reconstruction requires proof that recomputation is cheaper than the first resolve publishing the minimal demanded product.
  - Logical effect ownership does not require an independent GPU pass; physical fusion may reuse invocation-private Native facts without a Universal SurfaceRecord.
  - Architecture is frozen above implementation candidates; local candidate failures do not reject or redirect a complete phase architecture.
  - Management must be clearly cheaper than the useful work it enables; optional optimization requires analytical and measured break-even.
  - Preserve correct foundations; construct replacement owners completely before switching every direct consumer atomically, including bindings and abort/retry.
  - Cutover and destructive retirement are one unit; no old/new Surface intermediate dependencies, bridges or restored old contracts to pass tests.
  - Complete one architectural unit before concentrated validation; preserve valid numeric and lifecycle semantics when retiring representation tests.
  - Capability, capacity and overflow are explicit before allocation; do not truncate identities or lose work for a budget target.
  - Source facts, target design and validated adoption remain separate; unit state lives in the execution plan and module navigation in currentSlice.

deferredValidation:
  legacyRetiringPathDefects:
    - id: B2-NUM-001
      status: legacy-retiring-path-known-defect
      record: docs/next-execution/eengine-extreme-performance-rebuild-execution-2026-10.md#22-未关闭正确性问题与用户例外
      disposition: Unfixed and unresolved; not a V4 legacy-repair blocker. Retire only when the offending old producers are removed; migrate update, abort/retry and numeric semantics to V4 owners.
    - id: B2-NUM-002
      status: legacy-retiring-path-known-defect
      record: docs/next-execution/eengine-extreme-performance-rebuild-execution-2026-10.md#22-未关闭正确性问题与用户例外
      disposition: Unfixed and unresolved; not a V4 legacy-repair blocker. Retire only when the offending old producers are removed; migrate publication atomicity and stable HDR semantics to V4 owners.
  policy: >-
    Development uses light targeted checks. Closed units receive concentrated
    correctness, wiring, lifecycle and cost validation as defined by the execution plan.
    Each module receives its own required acceptance; formal whole-renderer browser,
    quality, performance evidence and claims wait for final integration.
    Missing required results keep the corresponding unit incomplete.
