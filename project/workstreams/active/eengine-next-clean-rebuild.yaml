goal: >-
  Rebuild Surface V3 first for GTX 1650 Ti at 1080p: few bounded execution scopes,
  explicit publication domains, complete direct evaluation, cost-classified reuse,
  thin Geometry products and finite material families. Command topology is independent
  of pixel, tile and material-instance counts; actual GPU work follows complete demand.
  Keep one authority per product, one production FrameGraph and one frame submit.

