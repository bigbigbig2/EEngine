schemaVersion: 2
id: eengine-next-clean-rebuild
title: EEngine Next single-path clean-cut renderer rebuild
domain: frame-runtime
state: active
owner: frame-runtime
decision: ADR-0020
goal: Replace the production Renderer in place, then restore complete algorithm providers on one new visibility-driven pipeline.

currentSlice:
  id: cut-old-composition
  title: Remove MainRenderPipeline ownership and bring up the minimal new visibility-to-present chain
  status: active
nextTasks:
  - Freeze the pre-cut Git baseline; identify and retire old claim/check expectations in the same code batch that removes their producers.
  - Replace Renderer inheritance and old recipe/feature topology with one new frame entry, GPU Scene publication, visibility, debug/base-color output, and present.
  - Preserve GPU Scene, VG, hardware visibility, FrameGraph, and the GPU producer-consumer closure; remove orphaned old effect passes and submits.
  - After the minimal chain, move Surface math into new owners and implement full/coarse/reuse semantics before porting old effects.

contracts:
  - render-product-work-history-v2
  - claims-and-evidence
  - virtual-geometry-runtime-v1
claims:
  - frame.recovery
  - shading.pipeline-pruning
  - visibility.gpu-closure
completedMilestones:
  - id: superseded-m1-preparation
    result: Prior foundation and source survey remain in Git and the source ledger; the behavior-preserving M1 composition task and proposed render-product-work-history-v1 contract were abandoned by ADR-0020. No new runtime is claimed.
tasks:
  - id: cut-old-composition
    state: active
    title: Delete old composition ownership and boot one minimal Renderer path
    dependsOn: []
    exitCriteria:
      - Renderer no longer extends MainRenderPipeline and only one production frame graph/submit path exists.
      - GPU Scene to visibility to debug/base color to present is GPU-closed; old AO/SSR/SSGI/GI/CSM/TAA/NSS effect owners do not survive as compatibility adapters.
      - Old claims and checks that no longer describe current code are retired or rewritten in the same cut.
      - Every old production owner actually deleted by this slice is added to checks/guards/legacy.yaml retiredPaths in the same code batch; existing paths are not retired early.
  - id: rebuild-surface-material
    state: todo
    title: Extract correct Surface mathematics and replace old sparse owner with material/frequency/compute shading
    dependsOn: [cut-old-composition]
    exitCriteria:
      - Every visible sample gets a valid full, coarse, reconstructed, or reused result under explicit Product semantics.
      - Old exactly-once claim and old SurfaceFeature/SparseShadingResolvePass ownership are removed after extraction.
      - Remove shading's broad OEngine/src/render/** routing fallback once the old root-level owners have been deleted or assigned precise paths.
  - id: environment-temporal
    state: todo
    title: Port physical environment and full selected FSR3 Upscaler profile on the new temporal boundary
    dependsOn: [rebuild-surface-material]
    exitCriteria:
      - Sun/Sky/atmosphere and final reconstruction have source-to-production maps and focused behavior checks.
  - id: light-transport
    state: todo
    title: Port VSM, XeGTAO, SSSR, and dynamic Screen/Atlas DDGI/Sky GI as complete providers
    dependsOn: [environment-temporal]
    exitCriteria:
      - Light-space caster generation, dynamic world sample production, fallback, and temporal consumers close on the GPU.
      - CSM and old effect services are absent from production.
  - id: virtual-control-media
    state: todo
    title: Converge virtual-resource control and port local Froxel media
    dependsOn: [light-transport]
    exitCriteria:
      - Shared budgets and versioning do not merge physical caches; media integrates with environment and lighting.
exitChecks:
  - model
  - registry
  - evidence-provenance
requiredEvidence:
  - During the destructive rebuild, focused compile, static, contract, and algorithm checks for the changed slice; no old effect-completeness gate.
  - Source-to-production mapping and focused reference comparison for each selected complete algorithm profile.
  - Independent browser and formal GPU/performance evidence only when runtime or performance claims are made.
openGates:
  - Phase 1 must rework old current-code claims and test expectations with the code cut; acceptance of ADR-0020 does not transfer old evidence.
  - The pre-cut renderer Git baseline still needs a fixed tag before production code is deleted; the source ledger is pinned but the new upstream algorithms remain unported.
  - GPU Work Runtime is not complete when only MeshletWork uses a preflight helper; ShadingWork and later Ray/Page consumers must demonstrate shared control semantics with specialized physical ABIs.
  - WebGPU VSM page raster bounds, Atlas dynamic software-BVH updates, adaptive shading benefit, a complete WebGPU VT profile, and FSR3 WGSL adaptation remain unproven.
  - Screen GI has source candidates but no selected WebGPU port profile or finalized near/world/sky energy boundary; VRS classification is not an adaptive compute shading implementation.
  - Record actual browser adapter/limits and budgets on both the GTX 1650 Ti and RTX 2060 machines when each is available.
links:
  decision: docs/adr/0020-clean-cut-renderer.md
  implementationRoute: docs/next-renderer.md
  sourceLedger: docs/porting/next-renderer.md
