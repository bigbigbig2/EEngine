schemaVersion: 2
id: eengine-next-clean-rebuild
title: EEngine Next single-path clean-cut renderer rebuild
domain: frame-runtime
state: active
owner: frame-runtime
decision: ADR-0020
goal: Establish the final architecture's Frame Program, Surface and Temporal boundaries on the single production path, then integrate planned providers in large continuous modules.

currentSlice:
  id: virtual-geometry-lod-correctness
  title: Virtual Geometry LOD handoff, residency fallback and conservative depth
  status: active
  goal: Repair the single production geometry path against Nyx and verify close-range, rotation and static views before continuing providers.
  completed: Meshlet refineGroupId handoff, 128-meshlet emission, spatial-ancestor fallback removal, conservative HZB footprint and RG16F rounding, Float32 position profile and terminal LOD error repair are implemented. Repaired the shared VirtualGeometrySceneSource mapper publishing world-space bounds into the object-space Instance ABI, which caused double-transformed root culling. Native RTX 2060 SUPER production root/traversal tests reproduce 8 false rejections across 20 camera poses with old bounds and pass all 20 with corrected bounds, including terminal FLT_MAX. Restored the complementary coarse <= SSE handoff after an inverted workspace edit. The 40 handoff GPU cases and conservative HZB oracles pass again; typecheck/build and 20 focused Node tests pass. Showcase visual verification remains pending user manual testing; no browser was launched as requested. Previous-HZB early rejection stays disabled for Virtual Geometry until recovery is connected. VSM E0-E9 completed directional page demand, 32-byte disjoint-mip page-table ABI, bounded GPU allocation and caster work, dirty-slot Atlas clear/raster, fail-open Surface sampling, CSM cutover, lifecycle integration and focused E9 tests. Perf Host now runs without an artificial FPS limiter, records existing GPU timestamp/counter and CPU evidence, and has completed Full plus GTAO/FSR3/Bloom/Environment/bounded-geometry A/B at 1280x720 with VSM disabled.

nextModules:
  - id: sssr
    title: FidelityFX SSSR production provider
  - id: hybrid-gi
    title: Screen, world-space and sky GI production providers
  - id: virtual-resource
    title: Virtual resource control-plane convergence and VT
  - id: transparency-media
    title: Transparency, local media and presentation integration

architectureRules:
  - Keep one production Renderer path and one frame submit owner.
  - Do not restore retired EnvironmentBackgroundPass, DirectionalLight world-sun ownership, CSM, old SSR/GTAO/SSGI/TAA, or a Legacy/Next dual path.
  - Do not introduce current-frame GPU-to-CPU-to-GPU visible/work control.
  - Pinned complex algorithms must preserve source stages, branches, dependencies and invariants; approximate implementations cannot claim upstream completion.
  - WebGPU capabilities and limits are negotiated before resource creation.

deferredValidation:
  policy: Deferred until the current large module or the whole Next Renderer is coherent.
  moduleClose:
    - typecheck
    - build
    - focused targeted tests for the completed module
  finalAcceptance:
    - browser matrix and lifecycle cases
    - scene/material/feature interaction coverage
    - visual quality comparison
    - GPU performance benchmark with P50/P95
    - formal evidence and claim promotion

