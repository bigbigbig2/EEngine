architectureRules:
  - Preserve V3 architecture and the final cost-bounded design; use the current execution plan, not historical per-step plans.
  - Keep one production renderer, one FrameGraph submit owner and original complete material/BRDF/IBL/provider semantics.
  - Keep Winner, Sharing and Cache identities separate; hashes select candidates and never prove identity.
  - Separate CandidateKey, ValueWitness and SharingCertificate; value hits do not authorize spatial sharing.
  - Bind Field sources before constructing Signal identities; transient indices are not stable cache keys.
  - Use publication dependency/cost profiles and fixed 2x2, 4x4 and 8x8 merges; delete arbitrary member and pair searches.
  - Bound proof operations, queries and admission; Unknown only refines related work without truncating proofs or output.
  - Use implicit/uniform/mixed work and guaranteed local setup with optional bounded memo; do not materialize every fine pixel task.
  - SurfaceGeometryPass is the sole hot/cold GeometryRecord producer; Appearance and Lighting do not decode triangles.
  - Field hits skip their own heavy closure; other dirty consumers may still request the unique GeometryRecord.
  - Do not impose universal full-key request dedup; admission failure uses correct transient work without global scans or spin.
  - Preserve independent signal packets, direct-diffuse semantics, TemporalFacts ownership and cheap reconstruction.
  - Reserve complete implicit-fine coverage before mixed publication; no partial coarse/fine overlapping writes.
  - Account for real layouts, mandatory worst-case capacity, reset masks, GPU limits and in-flight retirement before allocation.
  - Keep copy/clear outside compute passes and valid indirect usage scopes; cache compatible layouts and stable bindings.
  - No current-frame GPU-to-CPU-to-GPU work control, private submits, retired owners or compatibility bridges.
  - Validate each phase before advancing; Phase 1-6 including Phase 5.5 require typecheck/build, targeted semantics and relevant real GPU producer-consumer checks, with short whole-chain smoke when available.
  - Phase 5.5 is mandatory before Phase 6; migrate eager witnesses, dense certificate results, formula references and physical budget mapping with every direct consumer.
  - Phase completion needs actual cost-contract evidence as well as correctness; small-fixture output, bounded proof counts and allocation ceilings do not prove compact physical products.
  - Unresolved cache admission retains transient output and must not create multiple Store writers for one key; diagnostic timing must cover actual production pass names.
  - Maintain phase requirement coverage across real producers, all consumers, independent expectations, normal and failure cases, structural costs and actual source-identified results; green test counts do not prove completion.
  - Preserve failures, reproduce and classify the root cause before scoped repair; migrate stale fixtures without weakening semantic assertions or adding test-only production fallbacks, owners or submits.
  - Do not pass by skipping required assertions, loosening tolerances, disabling required features or forcing ordinary work to fine or residual; scope and quality changes require explicit user approval.
  - Read pinned complete source before complex implementation; design, implementation and validated adoption remain distinct.
  - Temporary compile failures or missing consumers are allowed only inside a phase; pull required wiring forward and never use adapters or placeholders to pass checks.
  - Preparation and historical repair results do not mark new reconstruction phases or performance claims complete.

deferredValidation:
  policy: >-
    Follow the user-requested per-phase validation policy. Phase 0 checks frozen identity, consumer/capacity
    inventories and documentation; each Phase 1-6 including mandatory Phase 5.5 completes typecheck/build, relevant semantic tests and
    real WGSL/GPU component wiring checks before advancing. Fix failures within the phase and pull required
    consumers forward; no placeholder or retired path. Phase 5.5 also verifies actual witness/proof/ref production,
    physical layouts and binding constraints; its unfinished structural work cannot be deferred to Phase 6.
    Follow current execution section 1.4 for coverage, independent oracles and failure repair; unresolved required
    checks, incomplete reports and stale artifacts cannot count as phase completion. Revalidate affected work
    after final production changes rather than combining passes from different snapshots.
    Phase 7 repeats integration and completes full
    quality/lifecycle/browser matrices and fixed-condition performance acceptance.
  finalAcceptance:
    - typecheck and build after the complete target and production wiring
    - shader compilation, CPU/WGSL numerical oracles, complete coverage and write ownership
    - browser and resize, camera cut, abort, device recovery and resource retirement
    - far/near, static/moving, high-frequency normal/ORM, multi-material and strong IBL quality
    - direct plus VSM, AO on/off, Product LOD/page miss, empty and single Product cases
    - same-condition independent-checkout comparison of 89f0a94, 15f12f7b, e7296be9, pre-refactor 14c17078 and the pinned final revision
    - GTX 1650 Ti 1080p complex scenes with fixed camera, features, browser, warm-up and thermal state
    - all-cost Surface and GPU frame P50/P95 with hit/miss, geometry, signal, exception, IBL, overflow and memory counters
    - V3 section 8-11 goals plus final cost-bounded design section 22; no promised FPS or fixed percentage
    - formal evidence and claim promotion only for actually validated scope

