<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22/>">
    <title>OEngine Virtual Product Observer</title>
    <style>
      :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; background: #111417; color: #e7edf2; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) 380px; background: #111417; }
      main { min-width: 0; display: grid; place-items: center; background: #080b0d; }
      canvas { width: 100%; height: 100vh; display: block; }
      aside { padding: 16px; border-left: 1px solid #2c343b; overflow: auto; }
      h1 { font-size: 18px; margin: 0 0 14px; }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #91a0aa; margin: 18px 0 8px; }
      label { display: block; font-size: 12px; color: #9eabb4; margin: 9px 0 4px; }
      input, select, button { width: 100%; min-height: 34px; border: 1px solid #3a454d; border-radius: 4px; background: #1a2025; color: #edf3f7; padding: 7px 9px; }
      button { cursor: pointer; font-weight: 600; }
      button:hover { background: #253039; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
      .grid button { font-size: 12px; }
      #status { margin: 12px 0 0; padding: 9px; min-height: 48px; white-space: pre-wrap; overflow-wrap: anywhere; background: #171d21; border: 1px solid #2c343b; border-radius: 4px; color: #c9d5dc; }
      dl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 10px; font-size: 11px; margin: 0; }
      dt { color: #8997a0; } dd { margin: 0; text-align: right; color: #e4edf2; font-variant-numeric: tabular-nums; max-width: 230px; overflow-wrap: anywhere; }
      pre.detail { max-height: 170px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; background: #0d1113; border: 1px solid #252e34; padding: 8px; font-size: 10px; color: #aebcc4; }
      .hint { color: #7f8d95; font-size: 11px; line-height: 1.45; margin-top: 14px; }
      @media (max-width: 820px) { body { display: block; } main { height: 60vh; } canvas { height: 60vh; } aside { border-left: 0; border-top: 1px solid #2c343b; } }
    </style>
  </head>
  <body>
    <main><canvas id="output"></canvas></main>
    <aside>
      <h1>Virtual Product Observer</h1>
      <label for="sourceKind">Source</label>
      <select id="sourceKind"><option value="web">Web GLB / glTF</option><option value="offline">Offline OEGPACK</option></select>
      <label for="profile">Runtime profile</label>
      <select id="profile"><option value="portable-single">portable-single</option><option value="portable-pool">portable-pool</option><option value="isolated-pthreads">isolated-pthreads</option></select>
      <label for="sourceUrl">URL / scene manifest</label>
      <input id="sourceUrl" type="url" value="/assets/oengine/glb-web-product-v1.glb" spellcheck="false">
      <label for="sourceFile">File / Blob (Web GLB only)</label>
      <input id="sourceFile" type="file" accept=".glb,.gltf,.oegpack,.oescene,model/gltf-binary,model/gltf+json">
      <div class="grid" style="margin-top:9px"><button id="load" type="button">Load</button><button id="cancel" type="button">Cancel</button><button id="replace" type="button">Replace</button><button id="breakSource" type="button">Break source</button></div>
      <h2>Camera / recovery</h2>
      <div class="grid"><button id="cameraClose" type="button">Camera close</button><button id="cameraCut" type="button">Camera cut</button><button id="deviceLoss" type="button">Device loss</button><button id="recover" type="button">Recover device</button></div>
      <pre id="status">idle</pre>
      <h2>Runtime evidence</h2>
      <dl id="metrics"></dl>
      <h2>Detailed evidence</h2>
      <pre id="detail" class="detail">等待 Product...</pre>
      <div class="hint">这是 ADR-0016 第七步的用户观察/验证宿主。它证明功能路径、可见首帧、revision 与 owner 账本；不会把 smoke 结果宣称为 60 FPS、显存物理节省或正式 PERF。Offline 本地文件若没有可解析的 scene.oescene manifest 会明确失败。</div>
    </aside>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
