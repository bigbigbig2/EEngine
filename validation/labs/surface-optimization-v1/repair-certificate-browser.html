<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Surface certificate checks</title>
<pre id="status">Starting…</pre><script type="module">
import {checkCertificateParents} from './repair-certificate-fixture.mjs';
const assert={ok(value,message){if(!value)throw Error(message??'Expected true');},equal(a,b,message){if(!Object.is(a,b))throw Error(message??`${a} != ${b}`);},deepEqual(a,b,message){if(JSON.stringify(a)!==JSON.stringify(b))throw Error(message??`${JSON.stringify(a)} != ${JSON.stringify(b)}`);}};
let device;
try{
  const adapter=await navigator.gpu.requestAdapter({powerPreference:'high-performance'});assert.ok(adapter&&!adapter.info.isFallbackAdapter);
  device=await adapter.requestDevice({requiredLimits:{maxStorageBuffersPerShaderStage:16}});
  const errors=[];device.addEventListener('uncapturederror',event=>errors.push(event.error.message));
  window.cellOracleStage='Production certificate parent merge';console.log(window.cellOracleStage);
  window.cellOracleResult=await checkCertificateParents(device,assert);window.cellOracleResult.errors=errors;assert.deepEqual(errors,[]);
}catch(error){window.cellOracleResult={passed:false,failure:error.stack};}
finally{device?.destroy();}
document.querySelector('#status').textContent=JSON.stringify(window.cellOracleResult,null,2);
</script></html>
